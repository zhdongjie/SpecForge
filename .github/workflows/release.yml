name: Publish tagged release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'zhdongjie/SpecForge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh auth setup-git --hostname github.com
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "refs/tags/$GITHUB_REF_NAME"
          git checkout --detach -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build, install and test core package
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/specforge-build"
          export PATH="$RUNNER_TEMP/specforge-build/bin:$PATH"
          python -m pip install --upgrade pip 'setuptools>=68' wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m pip install dist/*.whl
          python -m unittest discover -s tests_core -q
          cd "$RUNNER_TEMP"
          python -m specforge --help
          python -c "from importlib.resources import files; assert files('specforge').joinpath('assets/BusinessPanel.vue').is_file(); assert files('specforge.applications.recipe_management').joinpath('assets/RecipePanel.vue').is_file()"
      - name: Archive source and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix="SpecForge-$GITHUB_REF_NAME/" HEAD -o "dist/SpecForge-$GITHUB_REF_NAME-source.zip"
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "docs/releases/$GITHUB_REF_NAME.md"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "SpecForge $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-download-check"
          (cd "$RUNNER_TEMP/release-download-check" && sha256sum -c SHA256SUMS)
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url,tagName,isDraft,assets > "$RUNNER_TEMP/release-receipt.json"
          python3 - "$RUNNER_TEMP/release-receipt.json" <<'PYRECEIPT'
          import json, sys
          from pathlib import Path
          receipt = Path(sys.argv[1])
          data = json.loads(receipt.read_text())
          expected = {p.name: p.stat().st_size for p in Path('dist').iterdir() if p.is_file()}
          actual = {a['name']: a['size'] for a in data['assets']}
          assert not data['isDraft'] and actual == expected, (actual, expected)
          data['download_checksum_verification'] = 'PASS'
          data['sha256sums'] = Path('dist/SHA256SUMS').read_text()
          receipt.write_text(json.dumps(data, indent=2) + '\n')
          PYRECEIPT
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "release-receipt/$GITHUB_REF_NAME" -F "$RUNNER_TEMP/release-receipt.json"
          git push origin "refs/tags/release-receipt/$GITHUB_REF_NAME"
