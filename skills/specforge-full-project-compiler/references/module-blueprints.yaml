  library-management:
    project:
      name: Library Management Platform
      bounded_context: library-operations
      platform_scope: complete-platform
      primary_roles:
        - Administrator
        - Librarian
        - Reader
        - Auditor
      required_business_centers:
        - book-catalog-center
        - reader-membership-center
        - circulation-borrow-center
        - return-inspection-center
        - reservation-queue-center
        - acquisition-supplier-center
        - shelf-inventory-center
        - notification-center
        - report-statistics-center
      business_rules:
        - book copies must remain traceable to a catalog entry and physical inventory location
        - borrowing and return workflows must preserve centralized JWT authorization boundaries
        - reservation queue actions must not bypass reader eligibility and stock availability checks
        - reporting and notification flows must stay modular and consume library business events through explicit business modules
    modules:
      - module: book-catalog-management
        enabled: true
        semantic_role: business-domain
        bounded_context: book-catalog-center
        business_center: book-catalog-center
        package_root: org.eu.originalkeen.business.bookcatalog
        route_roots:
          - /v1/business/book-catalog
        authorities:
          - business:book-catalog:*
        entities:
          - BookCatalog
          - BookCopy
        tables:
          - book_catalog
          - book_copy
        purpose: book catalog metadata and copy lifecycle management
      - module: reader-membership-management
