        package_root: org.eu.originalkeen.business.returninspection
        route_roots:
          - /v1/business/return-inspection
        authorities:
          - business:return-inspection:*
        entities:
          - ReturnInspection
          - FineAssessment
        tables:
          - return_inspection
          - fine_assessment
        purpose: return review, overdue handling, and damage assessment management
      - module: reservation-queue-management
        enabled: true
        semantic_role: business-domain
        bounded_context: reservation-queue-center
        business_center: reservation-queue-center
        package_root: org.eu.originalkeen.business.reservationqueue
        route_roots:
          - /v1/business/reservation-queue
        authorities:
          - business:reservation-queue:*
        entities:
          - BookReservation
          - ReservationQueueEntry
        tables:
          - book_reservation
          - reservation_queue_entry
        purpose: reservation queue, waiting list, and fulfillment management
      - module: acquisition-supplier-management
        enabled: true
        semantic_role: business-domain
        bounded_context: acquisition-supplier-center
        business_center: acquisition-supplier-center
        package_root: org.eu.originalkeen.business.acquisitionsupplier
        route_roots:
          - /v1/business/acquisition-supplier
        authorities:
          - business:acquisition-supplier:*
        entities:
          - BookAcquisition
          - SupplierProfile
        tables:
          - book_acquisition
          - supplier_profile
        purpose: procurement planning and supplier collaboration management
      - module: shelf-inventory-management
        enabled: true
        semantic_role: business-domain
