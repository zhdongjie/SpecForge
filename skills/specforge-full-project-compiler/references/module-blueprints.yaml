        purpose: shelf organization, stocktake, and in-library inventory management
      - module: notification-management
        enabled: true
        semantic_role: business-domain
        bounded_context: notification-center
        business_center: notification-center
        package_root: org.eu.originalkeen.business.notification
        route_roots:
          - /v1/business/library-notification
        authorities:
          - business:library-notification:*
        entities:
          - LibraryNotification
          - NotificationDeliveryRecord
        tables:
          - library_notification
          - notification_delivery_record
        purpose: borrowing reminder and reader notification delivery management
      - module: report-statistics-management
        enabled: true
        semantic_role: business-domain
        bounded_context: report-statistics-center
        business_center: report-statistics-center
        package_root: org.eu.originalkeen.business.reportstatistics
        route_roots:
          - /v1/business/library-report
        authorities:
