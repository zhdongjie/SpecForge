module_spec:
  source_spec_id: auth-center-user-access-v1
  target_module_id: dictionary-management
  regeneration_mode: create
  bounded_context: system-administration
  module_name: dictionary-management
  responsibility: Manage reusable dictionary types and dictionary values with multilingual support for system-wide configuration and UI option sources.
  semantic_role: admin-domain
  architectural_expectations:
    preserve_existing_package_style: true
    preserve_existing_security_style: true
    preserve_existing_response_wrapper: true
    preserve_existing_logging_pattern: true
  dependencies:
    inbound:
      - authentication-and-authorization
    outbound:
      - localization-support
  capabilities:
    - capability_name: create-dictionary-type
      semantic_intent: create-record
      invariants:
        - dictionary type code must be unique
        - dictionary type name must be unique within the active language context
    - capability_name: update-dictionary-type
      semantic_intent: update-record
      invariants:
        - updates must preserve dictionary type identity
    - capability_name: delete-dictionary-types
      semantic_intent: delete-record
      invariants:
        - deletion must support batch administrative workflows
    - capability_name: page-dictionary-types
      semantic_intent: query-page
      invariants:
        - results must follow the repository pagination convention
    - capability_name: details-dictionary-type
      semantic_intent: query-details
    - capability_name: list-dictionary-types
      semantic_intent: query-list
    - capability_name: validate-dictionary-type-name
      semantic_intent: unique-validation
    - capability_name: validate-dictionary-type-code
      semantic_intent: unique-validation
    - capability_name: create-dictionary-data
      semantic_intent: create-record
      invariants:
        - dictionary data must belong to an existing dictionary type
    - capability_name: update-dictionary-data
      semantic_intent: update-record
    - capability_name: delete-dictionary-data
      semantic_intent: delete-record
    - capability_name: page-dictionary-data
      semantic_intent: query-page
    - capability_name: details-dictionary-data
      semantic_intent: query-details
    - capability_name: list-dictionary-data-by-type
      semantic_intent: query-list
      invariants:
        - output must be lightweight for UI option rendering
    - capability_name: validate-dictionary-data-label
      semantic_intent: unique-validation
    - capability_name: validate-dictionary-data-value
      semantic_intent: unique-validation
    - capability_name: localize-dictionary-types
      semantic_intent: translation
      invariants:
        - localized names must be retrievable in at least Chinese and English
    - capability_name: localize-dictionary-data
      semantic_intent: translation
      invariants:
        - localized labels must remain linked to their parent dictionary data records
  persistence_model:
    entities:
      - name: DictionaryType
        ownership: owned
        purpose: Represent the root category for reusable dictionary entries.
      - name: DictionaryTypeTranslation
        ownership: owned
        purpose: Store localized names and descriptions for dictionary types.
      - name: DictionaryData
        ownership: owned
        purpose: Represent selectable dictionary values under a type.
      - name: DictionaryDataTranslation
        ownership: owned
        purpose: Store localized labels for dictionary values.
  authorities:
    pattern_family: system:dictionary
    examples:
      - system:dictionary-type:create
      - system:dictionary-type:update
      - system:dictionary-data:page
      - system:dictionary-data:list
  semantic_invariants:
    - Dictionary types and dictionary data must remain administratively manageable as separate but related aggregates.
    - Translation records must not replace the ownership or identity of their parent entities.
    - Lightweight list capabilities must stay distinct from details and page capabilities.
  contract_requirements:
    - Preserve existing modular-monolith boundaries.
    - Preserve existing admin-style CRUD and validation conventions.
    - Preserve localized translation support.
    - Keep the module independently generatable in a future DAG pipeline.
