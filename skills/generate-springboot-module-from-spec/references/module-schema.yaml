module_schema:
  compiler_context:
    source_spec_id: string
    target_module_id: string
    regeneration_mode: create | regenerate | align
    stability_goal: deterministic | conservative
  module_identity:
    module_name: string
    bounded_context: string
    responsibility: string
    package_root: string
    route_prefix: string
    semantic_role: admin-domain | end-user-domain | support-domain | integration-domain | unknown
  architectural_fit:
    persistence_style: mybatis-flex | jpa | mybatis | unknown
    security_style: preauthorize | request-matcher | unknown
    response_style: response-wrapper | raw-response | unknown
    logging_style:
      access_log: enabled | disabled | unknown
      operate_log: enabled | disabled | unknown
    transaction_style: manager-boundary | service-boundary | mixed | unknown
  capability_set:
    - capability_name: string
      semantic_intent: create-record | update-record | delete-record | query-page | query-details | query-list | query-tree | unique-validation | assignment | translation | state-transition | policy-check | custom
      deterministic_pattern: create | update | delete | batch-delete | details | page | list | tree | uniqueness-check | assign | translate | state-transition | custom-action
      stability_class: stable | conditional | repo-dependent
      route: string
      authority: string
      transaction: read-only | read-write | none
      inputs:
        - string
      outputs:
        - string
      touched_entities:
        - string
      external_dependencies:
        - string
      generation_notes:
        - string
  semantic_invariants:
    - string
  dependency_graph:
    inbound:
      - string
    outbound:
      - string
  artifact_graph:
    resource:
      - string
    manager:
      - string
    service:
      - string
    service_impl:
      - string
    mapper:
      - string
    entity:
      - string
    dto:
      - string
    vo:
      - string
    bo:
      - string
  persistence_model:
    entities:
      - name: string
        purpose: string
        base_type: string
        relations:
          - string
        ownership: owned | referenced | junction
  contract_requirements:
    - string
  validation_targets:
    - string
  compatibility_notes:
    - string
