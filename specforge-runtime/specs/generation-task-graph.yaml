graph_context:
  graph_id: laboratory-reservation-management-generation-dag-v1
  graph_kind: semantic-module-generation
  source_module_spec: module-spec.yaml
  source_resolved_schema: module-schema.resolved.yaml
  target_module_id: laboratory-reservation-management
  bounded_context: laboratory-operations
  stability_goal: deterministic
  orchestration_mode: multi-agent-compatible
  retry_safe: true
  rollback_safe: true

architecture_boundary_enforcement:
  single_module_scope: true
  allowed_package_roots:
    - org.eu.originalkeen.business.labreservation
  forbidden_package_roots:
    - org.eu.originalkeen.authorize
    - org.eu.originalkeen.core
    - org.eu.originalkeen.system.user
    - org.eu.originalkeen.system.role
    - org.eu.originalkeen.system.permission
  allowed_shared_kernel_dependencies:
    - ResponseVo
    - PageVo
    - OperateLog
    - PreAuthorize
    - MyBatis-Flex
  enforcement_hooks:
    - hook-module-boundary-check
    - hook-package-placement-check

task_units:
  - task_id: T1-discover-architecture-baseline
    semantic_operation: architecture-discovery
    purpose: Bind repository conventions for laboratory reservation generation.
    stage: discovery
    preferred_agent_affinity: explorer
    execution_mode: serial
    inputs:
      - module-spec.yaml
      - project-spec.md
    outputs:
      - architecture-baseline
    dependency_policy:
      requires: []
      blocks:
        - T5-generate-laboratory-domain
        - T9-generate-reservation-domain
    validation_hooks:
      - hook-discovery-baseline-complete
    retry_policy:
      strategy: retry-on-ambiguity
      max_attempts: 2
    rollback_safe: true
  - task_id: T2-resolve-capability-schema
    semantic_operation: capability-normalization
    purpose: Expand semantic capabilities into deterministic bindings.
    stage: planning
    preferred_agent_affinity: explorer
    execution_mode: serial
    inputs:
      - module-spec.yaml
      - architecture-baseline
    outputs:
      - normalized-capability-set
    dependency_policy:
      requires:
        - T1-discover-architecture-baseline
      blocks:
        - T5-generate-laboratory-domain
        - T9-generate-reservation-domain
    validation_hooks:
      - hook-capability-route-match
    retry_policy:
      strategy: retry-on-unmapped-capability
      max_attempts: 2
    rollback_safe: true
  - task_id: T3-build-resolved-schema
    semantic_operation: resolved-ir-construction
    purpose: Produce the authoritative resolved generation plan.
    stage: planning
    preferred_agent_affinity: worker
    execution_mode: serial
    inputs:
      - module-spec.yaml
      - normalized-capability-set
    outputs:
      - module-schema.resolved.yaml
    dependency_policy:
      requires:
        - T1-discover-architecture-baseline
        - T2-resolve-capability-schema
      blocks:
        - T4-validate-resolved-schema
    validation_hooks:
      - hook-deterministic-layout-check
    retry_policy:
      strategy: retry-on-schema-conflict
      max_attempts: 2
    rollback_safe: true
  - task_id: T4-validate-resolved-schema
    semantic_operation: resolved-ir-validation
    purpose: Validate the resolved schema before code-producing stages begin.
    stage: planning-gate
    preferred_agent_affinity: explorer
    execution_mode: serial
    inputs:
      - module-schema.resolved.yaml
    outputs:
      - resolved-schema-approval
    dependency_policy:
      requires:
        - T3-build-resolved-schema
      blocks:
        - T5-generate-laboratory-domain
        - T9-generate-reservation-domain
    validation_hooks:
      - hook-module-boundary-check
    retry_policy:
      strategy: retry-after-schema-fix
      max_attempts: 2
    rollback_safe: true
  - task_id: T5-generate-laboratory-domain
    semantic_operation: domain-artifact-generation
    purpose: Generate laboratory DTO, VO, and entity layer.
    stage: generation
    preferred_agent_affinity: worker
    execution_mode: parallel
    inputs:
      - resolved-schema-approval
      - module-schema.resolved.yaml
    outputs:
      - laboratory-domain-artifacts
    dependency_policy:
      requires:
        - T4-validate-resolved-schema
      blocks:
        - T6-generate-laboratory-persistence
        - T7-generate-laboratory-services
    validation_hooks:
      - hook-artifact-name-convention
    retry_policy:
      strategy: retry-on-convention-mismatch
      max_attempts: 2
    rollback_safe: true
  - task_id: T6-generate-laboratory-persistence
    semantic_operation: persistence-binding-generation
    purpose: Generate laboratory mapper and persistence contracts.
    stage: generation
    preferred_agent_affinity: worker
    execution_mode: parallel
    inputs:
      - laboratory-domain-artifacts
      - module-schema.resolved.yaml
    outputs:
      - laboratory-persistence-artifacts
    dependency_policy:
      requires:
        - T5-generate-laboratory-domain
      blocks:
        - T7-generate-laboratory-services
    validation_hooks:
      - hook-package-placement-check
    retry_policy:
      strategy: retry-on-persistence-binding-failure
      max_attempts: 2
    rollback_safe: true
  - task_id: T7-generate-laboratory-services
    semantic_operation: service-orchestration-generation
    purpose: Generate laboratory service and manager orchestration.
    stage: generation
    preferred_agent_affinity: worker
    execution_mode: parallel
    inputs:
      - laboratory-domain-artifacts
      - laboratory-persistence-artifacts
      - module-schema.resolved.yaml
    outputs:
      - laboratory-service-artifacts
    dependency_policy:
      requires:
        - T5-generate-laboratory-domain
        - T6-generate-laboratory-persistence
      blocks:
        - T8-generate-laboratory-resource
        - T11-generate-reservation-services
    validation_hooks:
      - hook-capability-transaction-match
    retry_policy:
      strategy: retry-on-service-contract-mismatch
      max_attempts: 2
    rollback_safe: true
  - task_id: T8-generate-laboratory-resource
    semantic_operation: resource-layer-generation
    purpose: Generate laboratory administrative endpoints.
    stage: generation
    preferred_agent_affinity: worker
    execution_mode: parallel
    inputs:
      - laboratory-service-artifacts
      - module-schema.resolved.yaml
    outputs:
      - laboratory-resource-artifacts
    dependency_policy:
      requires:
        - T7-generate-laboratory-services
      blocks:
        - T13-integration-checkpoint-alpha
    validation_hooks:
      - hook-capability-route-match
      - hook-capability-authority-match
    retry_policy:
      strategy: retry-on-route-binding-failure
      max_attempts: 2
    rollback_safe: true
  - task_id: T9-generate-reservation-domain
    semantic_operation: domain-artifact-generation
    purpose: Generate reservation DTO, VO, and entity layer.
    stage: generation
    preferred_agent_affinity: worker
    execution_mode: parallel
    inputs:
      - resolved-schema-approval
      - module-schema.resolved.yaml
      - laboratory-domain-artifacts
    outputs:
      - reservation-domain-artifacts
    dependency_policy:
      requires:
        - T4-validate-resolved-schema
        - T5-generate-laboratory-domain
      blocks:
        - T10-generate-reservation-persistence
        - T11-generate-reservation-services
    validation_hooks:
      - hook-artifact-name-convention
    retry_policy:
      strategy: retry-on-convention-mismatch
      max_attempts: 2
    rollback_safe: true
  - task_id: T10-generate-reservation-persistence
    semantic_operation: persistence-binding-generation
    purpose: Generate reservation mapper and persistence contracts.
    stage: generation
    preferred_agent_affinity: worker
    execution_mode: parallel
    inputs:
      - reservation-domain-artifacts
      - module-schema.resolved.yaml
    outputs:
      - reservation-persistence-artifacts
    dependency_policy:
      requires:
        - T9-generate-reservation-domain
      blocks:
        - T11-generate-reservation-services
    validation_hooks:
      - hook-package-placement-check
    retry_policy:
      strategy: retry-on-persistence-binding-failure
      max_attempts: 2
    rollback_safe: true
  - task_id: T11-generate-reservation-services
    semantic_operation: service-orchestration-generation
    purpose: Generate reservation service and manager orchestration.
    stage: generation
    preferred_agent_affinity: worker
    execution_mode: parallel
    inputs:
      - laboratory-service-artifacts
      - reservation-domain-artifacts
      - reservation-persistence-artifacts
      - module-schema.resolved.yaml
    outputs:
      - reservation-service-artifacts
    dependency_policy:
      requires:
        - T7-generate-laboratory-services
        - T9-generate-reservation-domain
        - T10-generate-reservation-persistence
      blocks:
        - T12-generate-reservation-resource
    validation_hooks:
      - hook-capability-transaction-match
      - hook-foreign-reference-check
    retry_policy:
      strategy: retry-on-service-contract-mismatch
      max_attempts: 2
    rollback_safe: true
  - task_id: T12-generate-reservation-resource
    semantic_operation: resource-layer-generation
    purpose: Generate reservation administrative endpoints.
    stage: generation
    preferred_agent_affinity: worker
    execution_mode: parallel
    inputs:
      - reservation-service-artifacts
      - module-schema.resolved.yaml
    outputs:
      - reservation-resource-artifacts
    dependency_policy:
      requires:
        - T11-generate-reservation-services
      blocks:
        - T13-integration-checkpoint-alpha
    validation_hooks:
      - hook-capability-route-match
      - hook-capability-authority-match
    retry_policy:
      strategy: retry-on-route-binding-failure
      max_attempts: 2
    rollback_safe: true
  - task_id: T13-integration-checkpoint-alpha
    semantic_operation: intra-module-integration-validation
    purpose: Validate laboratory and reservation layers before final checks.
    stage: integration-checkpoint
    preferred_agent_affinity: explorer
    execution_mode: serial
    inputs:
      - laboratory-resource-artifacts
      - reservation-resource-artifacts
      - module-schema.resolved.yaml
    outputs:
      - module-integration-approval
    dependency_policy:
      requires:
        - T8-generate-laboratory-resource
        - T12-generate-reservation-resource
      blocks:
        - T14-run-validation-hooks
    validation_hooks:
      - hook-module-boundary-check
      - hook-foreign-reference-check
    retry_policy:
      strategy: retry-after-targeted-fix
      max_attempts: 2
    rollback_safe: true
  - task_id: T14-run-validation-hooks
    semantic_operation: final-validation-pass
    purpose: Run final compiler and architecture validation hooks.
    stage: validation
    preferred_agent_affinity: explorer
    execution_mode: serial
    inputs:
      - module-integration-approval
      - module-schema.resolved.yaml
    outputs:
      - final-validation-approval
    dependency_policy:
      requires:
        - T13-integration-checkpoint-alpha
      blocks:
        - T15-finalize-generation-bundle
    validation_hooks:
      - hook-deterministic-layout-check
      - hook-module-boundary-check
    retry_policy:
      strategy: retry-after-fix
      max_attempts: 2
    rollback_safe: true
  - task_id: T15-finalize-generation-bundle
    semantic_operation: generation-finalization
    purpose: Seal the module generation result as a bounded DAG node output.
    stage: finalize
    preferred_agent_affinity: worker
    execution_mode: serial
    inputs:
      - final-validation-approval
      - all-generated-artifacts
    outputs:
      - finalized-module-bundle
    dependency_policy:
      requires:
        - T14-run-validation-hooks
      blocks: []
    validation_hooks:
      - hook-module-boundary-check
    retry_policy:
      strategy: no-retry-without-upstream-fix
      max_attempts: 1
    rollback_safe: true

dependency_edges:
  - from: T1-discover-architecture-baseline
    to: T2-resolve-capability-schema
  - from: T1-discover-architecture-baseline
    to: T3-build-resolved-schema
  - from: T2-resolve-capability-schema
    to: T3-build-resolved-schema
  - from: T3-build-resolved-schema
    to: T4-validate-resolved-schema
  - from: T4-validate-resolved-schema
    to: T5-generate-laboratory-domain
  - from: T4-validate-resolved-schema
    to: T9-generate-reservation-domain
  - from: T5-generate-laboratory-domain
    to: T6-generate-laboratory-persistence
  - from: T5-generate-laboratory-domain
    to: T7-generate-laboratory-services
  - from: T6-generate-laboratory-persistence
    to: T7-generate-laboratory-services
  - from: T7-generate-laboratory-services
    to: T8-generate-laboratory-resource
  - from: T5-generate-laboratory-domain
    to: T9-generate-reservation-domain
  - from: T9-generate-reservation-domain
    to: T10-generate-reservation-persistence
  - from: T7-generate-laboratory-services
    to: T11-generate-reservation-services
  - from: T9-generate-reservation-domain
    to: T11-generate-reservation-services
  - from: T10-generate-reservation-persistence
    to: T11-generate-reservation-services
  - from: T11-generate-reservation-services
    to: T12-generate-reservation-resource
  - from: T8-generate-laboratory-resource
    to: T13-integration-checkpoint-alpha
  - from: T12-generate-reservation-resource
    to: T13-integration-checkpoint-alpha
  - from: T13-integration-checkpoint-alpha
    to: T14-run-validation-hooks
  - from: T14-run-validation-hooks
    to: T15-finalize-generation-bundle

execution_order:
  serial_order:
    - T1-discover-architecture-baseline
    - T2-resolve-capability-schema
    - T3-build-resolved-schema
    - T4-validate-resolved-schema
    - T5-generate-laboratory-domain
    - T6-generate-laboratory-persistence
    - T7-generate-laboratory-services
    - T8-generate-laboratory-resource
    - T9-generate-reservation-domain
    - T10-generate-reservation-persistence
    - T11-generate-reservation-services
    - T12-generate-reservation-resource
    - T13-integration-checkpoint-alpha
    - T14-run-validation-hooks
    - T15-finalize-generation-bundle
