compiler_context:
  source_spec_id: insurance-policy-platform-v1
  target_module_id: insurance-policy-management
  regeneration_mode: create
  stability_goal: deterministic
  planner_tags:
    - bounded-module
    - insurance-policy-domain
    - dag-node

module_identity:
  module_name: insurance-policy-management
  bounded_context: insurance-policy-operations
  semantic_role: business-domain
  responsibility_code: insurance-policy-operations
  package_root: org.eu.originalkeen.business.insurancepolicy
  route_namespace:
    insurance_product: /v1/business/insurance-product
    insurance_policy: /v1/business/insurance-policy

generation_boundaries:
  single_module_only: true
  owns_aggregates:
    - InsuranceProduct
    - InsurancePolicy
  may_reference:
    - ResponseVo
    - PageVo
    - OperateLog
    - PreAuthorize
    - MyBatis-Flex persistence contracts
  must_not_generate:
    - authentication flows
    - user management
    - role management
    - permission tree management
    - access log storage
  allowed_external_dependencies:
    inbound:
      - centralized-jwt-security
      - global-response-wrapper
      - global-exception-handling
    outbound:
      - mysql-insurance-tables
      - operation-audit-aspect

architecture_discovery_hints:
  nearest_sibling_modules:
    - org.eu.originalkeen.business.personal
    - org.eu.originalkeen.system.user
    - org.eu.originalkeen.system.dictionary
  expected_layering:
    - resource
    - manager
    - service
    - service.impl
    - mapper
    - domain.entity
    - domain.dto
    - domain.vo
  expected_controller_suffix: Resource
  expected_business_orchestrator_suffix: Manager
  expected_query_dto_prefix: Enquiry
  expected_response_wrapper: ResponseVo
  expected_page_wrapper: PageVo
  expected_security_style: "@PreAuthorize(hasAuthority(...))"
  expected_mutation_logging: "@OperateLog"
  expected_persistence_style: mybatis-flex

api_groups:
  - group_id: insurance-product-admin
    route_prefix: /v1/business/insurance-product
    aggregate: InsuranceProduct
    capability_ids:
      - create-insurance-product
      - update-insurance-product
      - batch-delete-insurance-product
      - enquiry-insurance-product-page
      - enquiry-insurance-product-details
      - enquiry-insurance-product-list
  - group_id: insurance-policy-admin
    route_prefix: /v1/business/insurance-policy
    aggregate: InsurancePolicy
    capability_ids:
      - create-insurance-policy
      - update-insurance-policy
      - batch-delete-insurance-policy
      - enquiry-insurance-policy-page
      - enquiry-insurance-policy-details
      - enquiry-insurance-policy-list

capabilities:
  - capability_id: create-insurance-product
    semantic_intent: create-record
    deterministic_pattern: create
    stability_class: stable
    api_group: insurance-product-admin
    http_method: POST
    route: /
    authority: business:insurance-product:create
    transaction: read-write
    input_dto: CreateInsuranceProductDto
    output_vo: Void
    touched_entities:
      - InsuranceProduct
    invariants:
      - insurance_product_code_unique
      - insurance_product_name_unique
  - capability_id: update-insurance-product
    semantic_intent: update-record
    deterministic_pattern: update
    stability_class: stable
    api_group: insurance-product-admin
    http_method: PUT
    route: /
    authority: business:insurance-product:update
    transaction: read-write
    input_dto: UpdateInsuranceProductDto
    output_vo: Void
    touched_entities:
      - InsuranceProduct
    invariants:
      - insurance_product_code_unique
      - insurance_product_name_unique
  - capability_id: batch-delete-insurance-product
    semantic_intent: delete-record
    deterministic_pattern: batch-delete
    stability_class: stable
    api_group: insurance-product-admin
    http_method: DELETE
    route: /
    authority: business:insurance-product:delete
    transaction: read-write
    input_dto: InsuranceProductIdSet
    output_vo: Void
    touched_entities:
      - InsuranceProduct
  - capability_id: enquiry-insurance-product-page
    semantic_intent: query-page
    deterministic_pattern: page
    stability_class: stable
    api_group: insurance-product-admin
    http_method: GET
    route: /page
    authority: business:insurance-product:page
    transaction: read-only
    input_dto: EnquiryInsuranceProductPageDto
    output_vo: PageVo<InsuranceProductPageVo>
    touched_entities:
      - InsuranceProduct
  - capability_id: enquiry-insurance-product-details
    semantic_intent: query-details
    deterministic_pattern: details
    stability_class: stable
    api_group: insurance-product-admin
    http_method: GET
    route: /{id}
    authority: business:insurance-product:details
    transaction: read-only
    input_dto: InsuranceProductIdPath
    output_vo: InsuranceProductDetailsVo
    touched_entities:
      - InsuranceProduct
  - capability_id: enquiry-insurance-product-list
    semantic_intent: query-list
    deterministic_pattern: list
    stability_class: stable
    api_group: insurance-product-admin
    http_method: GET
    route: /list
    authority: business:insurance-product:list
    transaction: read-only
    input_dto: None
    output_vo: List<InsuranceProductListVo>
    touched_entities:
      - InsuranceProduct
  - capability_id: create-insurance-policy
    semantic_intent: create-record
    deterministic_pattern: create
    stability_class: stable
    api_group: insurance-policy-admin
    http_method: POST
    route: /
    authority: business:insurance-policy:create
    transaction: read-write
    input_dto: CreateInsurancePolicyDto
    output_vo: Void
    touched_entities:
      - InsurancePolicy
      - InsuranceProduct
    invariants:
      - insurance_policy_number_unique
      - insurance_policy_product_must_exist
  - capability_id: update-insurance-policy
    semantic_intent: update-record
    deterministic_pattern: update
    stability_class: stable
    api_group: insurance-policy-admin
    http_method: PUT
    route: /
    authority: business:insurance-policy:update
    transaction: read-write
    input_dto: UpdateInsurancePolicyDto
    output_vo: Void
    touched_entities:
      - InsurancePolicy
      - InsuranceProduct
    invariants:
      - insurance_policy_number_unique
      - insurance_policy_product_must_exist
  - capability_id: batch-delete-insurance-policy
    semantic_intent: delete-record
    deterministic_pattern: batch-delete
    stability_class: stable
    api_group: insurance-policy-admin
    http_method: DELETE
    route: /
    authority: business:insurance-policy:delete
    transaction: read-write
    input_dto: InsurancePolicyIdSet
    output_vo: Void
    touched_entities:
      - InsurancePolicy
  - capability_id: enquiry-insurance-policy-page
    semantic_intent: query-page
    deterministic_pattern: page
    stability_class: stable
    api_group: insurance-policy-admin
    http_method: GET
    route: /page
    authority: business:insurance-policy:page
    transaction: read-only
    input_dto: EnquiryInsurancePolicyPageDto
    output_vo: PageVo<InsurancePolicyPageVo>
    touched_entities:
      - InsurancePolicy
      - InsuranceProduct
  - capability_id: enquiry-insurance-policy-details
    semantic_intent: query-details
    deterministic_pattern: details
    stability_class: stable
    api_group: insurance-policy-admin
    http_method: GET
    route: /{id}
    authority: business:insurance-policy:details
    transaction: read-only
    input_dto: InsurancePolicyIdPath
    output_vo: InsurancePolicyDetailsVo
    touched_entities:
      - InsurancePolicy
      - InsuranceProduct
  - capability_id: enquiry-insurance-policy-list
    semantic_intent: query-list
    deterministic_pattern: list
    stability_class: stable
    api_group: insurance-policy-admin
    http_method: GET
    route: /list
    authority: business:insurance-policy:list
    transaction: read-only
    input_dto: None
    output_vo: List<InsurancePolicyListVo>
    touched_entities:
      - InsurancePolicy
      - InsuranceProduct

entity_graph:
  entities:
    - entity_id: InsuranceProduct
      table: insurance_product
      ownership: owned
      base_type: PrimaryKeyEntity
      aggregate_role: root
      relations:
        - relation: one-to-many
          target: InsurancePolicy
          relation_name: policies
    - entity_id: InsurancePolicy
      table: insurance_policy
      ownership: owned
      base_type: PrimaryKeyEntity
      aggregate_role: child-root
      relations:
        - relation: many-to-one
          target: InsuranceProduct
          relation_name: insuranceProduct

artifact_contract:
  resource:
    - InsuranceProductResource
    - InsurancePolicyResource
  manager:
    - InsuranceProductManager
    - InsurancePolicyManager
  service:
    - InsuranceProductService
    - InsurancePolicyService
  service_impl:
    - InsuranceProductServiceImpl
    - InsurancePolicyServiceImpl
  mapper:
    - InsuranceProductMapper
    - InsurancePolicyMapper
  entity:
    - InsuranceProduct
    - InsurancePolicy
  dto:
    - CreateInsuranceProductDto
    - UpdateInsuranceProductDto
    - EnquiryInsuranceProductPageDto
    - CreateInsurancePolicyDto
    - UpdateInsurancePolicyDto
    - EnquiryInsurancePolicyPageDto
  vo:
    - InsuranceProductDetailsVo
    - InsuranceProductPageVo
    - InsuranceProductListVo
    - InsurancePolicyDetailsVo
    - InsurancePolicyPageVo
    - InsurancePolicyListVo
  bo: []

validation_rules:
  uniqueness:
    - rule_id: insurance_product_code_unique
      scope: insurance_product.insurance_product_code
    - rule_id: insurance_product_name_unique
      scope: insurance_product.insurance_product_name
    - rule_id: insurance_policy_number_unique
      scope: insurance_policy.insurance_policy_number
  referential:
    - rule_id: insurance_policy_product_must_exist
      source: InsurancePolicy.insurance_product_id
      target: InsuranceProduct.id
  shape:
    - rule_id: repository_pagination_pattern_preserved
      target_capability:
        - enquiry-insurance-product-page
        - enquiry-insurance-policy-page

architecture_constraints:
  modular_monolith_mode: true
  package_layout_must_match_siblings: true
  response_wrapper_must_be: ResponseVo
  page_wrapper_must_be: PageVo
  mutation_logging_required_for:
    - create-insurance-product
    - update-insurance-product
    - batch-delete-insurance-product
    - create-insurance-policy
    - update-insurance-policy
    - batch-delete-insurance-policy
  security_annotation_required: true
  security_style:
    type: preauthorize-authority
    authority_prefixes:
      - business:insurance-product:
      - business:insurance-policy:
  transaction_boundary: manager-boundary
  controller_suffix: Resource
  manager_suffix: Manager

persistence_conventions:
  framework: mybatis-flex
  database: mysql
  query_style:
    page_queries_use_enquiry_dto: true
    detail_queries_use_path_id: true
    list_queries_use_simple_collection_read: true
  ownership_model:
    insurance_product_as_parent_reference: true
    insurance_policy_belongs_to_product: true

localization_requirements:
  mandatory: false
  languages: []
  localized_aggregates: []
  localized_fields: {}
  fallback_policy: none

audit_behavior:
  access_log: none
  operate_log:
    enabled: true
    target_capabilities:
      - create-insurance-product
      - update-insurance-product
      - batch-delete-insurance-product
      - create-insurance-policy
      - update-insurance-policy
      - batch-delete-insurance-policy
    titles:
      create-insurance-product: Create Insurance Product
      update-insurance-product: Update Insurance Product
      batch-delete-insurance-product: Batch Delete Insurance Products
      create-insurance-policy: Create Insurance Policy
      update-insurance-policy: Update Insurance Policy
      batch-delete-insurance-policy: Batch Delete Insurance Policies

generation_contract:
  deterministic_output_required: true
  sibling_pattern_priority: business.personal,system.user,system.dictionary
  preserve_project_contracts:
    - administrative-crud-consistency
    - centralized-authority-based-security
    - modular-monolith-boundaries
    - insurance-policy-product-referential-integrity
  dag_compatibility:
    isolated_node: true
    explicit_dependencies_only: true
    no_hidden_cross_module_coupling: true
