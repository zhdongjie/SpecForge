compiler_context:
  source_spec_id: laboratory-resource-platform-v1
  target_module_id: laboratory-resource-management
  regeneration_mode: create
  stability_goal: deterministic
  planner_tags:
    - bounded-module
    - laboratory-resource-center
    - dag-node

module_identity:
  module_name: laboratory-resource-management
  bounded_context: laboratory-resource-center
  semantic_role: business-domain
  responsibility_code: laboratory-resource-operations
  package_root: org.eu.originalkeen.business.labresource
  route_namespace:
    laboratory_building: /v1/business/laboratory-building
    laboratory_room: /v1/business/laboratory-room

generation_boundaries:
  single_module_only: true
  owns_aggregates:
    - LaboratoryBuilding
    - LaboratoryRoom
  may_reference:
    - ResponseVo
    - PageVo
    - OperateLog
    - PreAuthorize
    - MyBatis-Flex persistence contracts
  must_not_generate:
    - authentication flows
    - user management
    - role management
    - permission tree management
  allowed_external_dependencies:
    inbound:
      - centralized-jwt-security
      - global-response-wrapper
      - global-exception-handling
    outbound:
      - mysql-laboratory-resource-tables
      - operation-audit-aspect

api_groups:
  - group_id: laboratory-building-admin
    route_prefix: /v1/business/laboratory-building
    aggregate: LaboratoryBuilding
    capability_ids:
      - create-laboratory-building
      - update-laboratory-building
      - batch-delete-laboratory-building
      - enquiry-laboratory-building-page
      - enquiry-laboratory-building-details
      - enquiry-laboratory-building-list
  - group_id: laboratory-room-admin
    route_prefix: /v1/business/laboratory-room
    aggregate: LaboratoryRoom
    capability_ids:
      - create-laboratory-room
      - update-laboratory-room
      - batch-delete-laboratory-room
      - enquiry-laboratory-room-page
      - enquiry-laboratory-room-details
      - enquiry-laboratory-room-list

capabilities:
  - capability_id: create-laboratory-building
    semantic_intent: create-record
    deterministic_pattern: create
    stability_class: stable
    api_group: laboratory-building-admin
    http_method: POST
    route: /
    authority: business:laboratory-building:create
    transaction: read-write
    input_dto: CreateLaboratoryBuildingDto
    output_vo: Void
    touched_entities:
      - LaboratoryBuilding
  - capability_id: update-laboratory-building
    semantic_intent: update-record
    deterministic_pattern: update
    stability_class: stable
    api_group: laboratory-building-admin
    http_method: PUT
    route: /
    authority: business:laboratory-building:update
    transaction: read-write
    input_dto: UpdateLaboratoryBuildingDto
    output_vo: Void
    touched_entities:
      - LaboratoryBuilding
  - capability_id: batch-delete-laboratory-building
    semantic_intent: delete-record
    deterministic_pattern: batch-delete
    stability_class: stable
    api_group: laboratory-building-admin
    http_method: DELETE
    route: /
    authority: business:laboratory-building:delete
    transaction: read-write
    input_dto: LaboratoryBuildingIdSet
    output_vo: Void
    touched_entities:
      - LaboratoryBuilding
  - capability_id: enquiry-laboratory-building-page
    semantic_intent: query-page
    deterministic_pattern: page
    stability_class: stable
    api_group: laboratory-building-admin
    http_method: GET
    route: /page
    authority: business:laboratory-building:page
    transaction: read-only
    input_dto: EnquiryLaboratoryBuildingPageDto
    output_vo: PageVo<LaboratoryBuildingPageVo>
    touched_entities:
      - LaboratoryBuilding
  - capability_id: enquiry-laboratory-building-details
    semantic_intent: query-details
    deterministic_pattern: details
    stability_class: stable
    api_group: laboratory-building-admin
    http_method: GET
    route: /{id}
    authority: business:laboratory-building:details
    transaction: read-only
    input_dto: LaboratoryBuildingIdPath
    output_vo: LaboratoryBuildingDetailsVo
    touched_entities:
      - LaboratoryBuilding
  - capability_id: enquiry-laboratory-building-list
    semantic_intent: query-list
    deterministic_pattern: list
    stability_class: stable
    api_group: laboratory-building-admin
    http_method: GET
    route: /list
    authority: business:laboratory-building:list
    transaction: read-only
    input_dto: None
    output_vo: List<LaboratoryBuildingListVo>
    touched_entities:
      - LaboratoryBuilding
  - capability_id: create-laboratory-room
    semantic_intent: create-record
    deterministic_pattern: create
    stability_class: stable
    api_group: laboratory-room-admin
    http_method: POST
    route: /
    authority: business:laboratory-room:create
    transaction: read-write
    input_dto: CreateLaboratoryRoomDto
    output_vo: Void
    touched_entities:
      - LaboratoryRoom
      - LaboratoryBuilding
  - capability_id: update-laboratory-room
    semantic_intent: update-record
    deterministic_pattern: update
    stability_class: stable
    api_group: laboratory-room-admin
    http_method: PUT
    route: /
    authority: business:laboratory-room:update
    transaction: read-write
    input_dto: UpdateLaboratoryRoomDto
    output_vo: Void
    touched_entities:
      - LaboratoryRoom
      - LaboratoryBuilding
  - capability_id: batch-delete-laboratory-room
    semantic_intent: delete-record
    deterministic_pattern: batch-delete
    stability_class: stable
    api_group: laboratory-room-admin
    http_method: DELETE
    route: /
    authority: business:laboratory-room:delete
    transaction: read-write
    input_dto: LaboratoryRoomIdSet
    output_vo: Void
    touched_entities:
      - LaboratoryRoom
  - capability_id: enquiry-laboratory-room-page
    semantic_intent: query-page
    deterministic_pattern: page
    stability_class: stable
    api_group: laboratory-room-admin
    http_method: GET
    route: /page
    authority: business:laboratory-room:page
    transaction: read-only
    input_dto: EnquiryLaboratoryRoomPageDto
    output_vo: PageVo<LaboratoryRoomPageVo>
    touched_entities:
      - LaboratoryRoom
      - LaboratoryBuilding
  - capability_id: enquiry-laboratory-room-details
    semantic_intent: query-details
    deterministic_pattern: details
    stability_class: stable
    api_group: laboratory-room-admin
    http_method: GET
    route: /{id}
    authority: business:laboratory-room:details
    transaction: read-only
    input_dto: LaboratoryRoomIdPath
    output_vo: LaboratoryRoomDetailsVo
    touched_entities:
      - LaboratoryRoom
      - LaboratoryBuilding
  - capability_id: enquiry-laboratory-room-list
    semantic_intent: query-list
    deterministic_pattern: list
    stability_class: stable
    api_group: laboratory-room-admin
    http_method: GET
    route: /list
    authority: business:laboratory-room:list
    transaction: read-only
    input_dto: None
    output_vo: List<LaboratoryRoomListVo>
    touched_entities:
      - LaboratoryRoom
      - LaboratoryBuilding

entity_graph:
  entities:
    - entity_id: LaboratoryBuilding
      table: laboratory_building
      ownership: owned
      base_type: PrimaryKeyEntity
      aggregate_role: root
      relations:
        - relation: one-to-many
          target: LaboratoryRoom
          relation_name: rooms
    - entity_id: LaboratoryRoom
      table: laboratory_room
      ownership: owned
      base_type: PrimaryKeyEntity
      aggregate_role: child-root
      relations:
        - relation: many-to-one
          target: LaboratoryBuilding
          relation_name: laboratoryBuilding

validation_rules:
  uniqueness:
    - rule_id: laboratory_building_code_unique
      scope: laboratory_building.laboratory_building_code
    - rule_id: laboratory_room_code_unique
      scope: laboratory_room.laboratory_room_code
  referential:
    - rule_id: laboratory_room_building_must_exist
      source: LaboratoryRoom.laboratory_building_id
      target: LaboratoryBuilding.id
  shape:
    - rule_id: repository_pagination_pattern_preserved
      target_capability:
        - enquiry-laboratory-building-page
        - enquiry-laboratory-room-page

architecture_constraints:
  modular_monolith_mode: true
  response_wrapper_must_be: ResponseVo
  page_wrapper_must_be: PageVo
  security_annotation_required: true

persistence_conventions:
  framework: mybatis-flex
  database: mysql

localization_requirements:
  mandatory: false
  languages: []
  localized_aggregates: []
  localized_fields: {}
  fallback_policy: none

audit_behavior:
  access_log: none
  operate_log:
    enabled: true
    target_capabilities:
      - create-laboratory-building
      - update-laboratory-building
      - batch-delete-laboratory-building
      - create-laboratory-room
      - update-laboratory-room
      - batch-delete-laboratory-room

generation_contract:
  deterministic_output_required: true
  preserve_project_contracts:
    - modular-monolith-boundaries
    - centralized-authority-based-security
