# semantic_ir: compiler input identity and regeneration mode
compiler_context:
  source_spec_id: original-keen-auth-center-v1
  target_module_id: dictionary-management
  regeneration_mode: create
  stability_goal: deterministic
  planner_tags:
    - bounded-module
    - admin-domain
    - dag-node

# semantic_ir: bounded module identity
module_identity:
  module_name: dictionary-management
  bounded_context: system-administration
  semantic_role: admin-domain
  responsibility_code: reference-data-localization
  package_root: org.eu.originalkeen.system.dictionary
  route_namespace:
    dictionary_type: /v1/system/dictionary-type
    dictionary_data: /v1/system/dictionary-data

# regeneration_constraint: hard generation boundary
generation_boundaries:
  single_module_only: true
  owns_aggregates:
    - DictionaryType
    - DictionaryTypeTranslation
    - DictionaryData
    - DictionaryDataTranslation
  may_reference:
    - ResponseVo
    - PageVo
    - OperateLog
    - PreAuthorize
    - MyBatis-Flex persistence contracts
  must_not_generate:
    - authentication flows
    - user management
    - role management
    - permission tree management
    - access log storage
    - operate log storage
  allowed_external_dependencies:
    inbound:
      - centralized-jwt-security
      - global-response-wrapper
      - global-exception-handling
      - i18n-message-resolution
    outbound:
      - mysql-dictionary-tables
      - operation-audit-aspect

# architecture_discovery_hint: conventions to discover and preserve
architecture_discovery_hints:
  nearest_sibling_modules:
    - org.eu.originalkeen.system.user
    - org.eu.originalkeen.system.role
    - org.eu.originalkeen.system.permission
  expected_layering:
    - resource
    - manager
    - service
    - service.impl
    - mapper
    - domain.entity
    - domain.dto
    - domain.vo
  expected_controller_suffix: Resource
  expected_business_orchestrator_suffix: Manager
  expected_query_dto_prefix: Enquiry
  expected_response_wrapper: ResponseVo
  expected_page_wrapper: PageVo
  expected_security_style: "@PreAuthorize(hasAuthority(...))"
  expected_mutation_logging: "@OperateLog"
  expected_persistence_style: mybatis-flex

# semantic_ir: capability groups for planners and generators
api_groups:
  - group_id: dictionary-type-admin
    route_prefix: /v1/system/dictionary-type
    aggregate: DictionaryType
    capability_ids:
      - create-dictionary-type
      - update-dictionary-type
      - batch-delete-dictionary-type
      - enquiry-dictionary-type-page
      - enquiry-dictionary-type-details
      - enquiry-dictionary-type-list
      - validate-dictionary-type-name
      - validate-dictionary-type-code
  - group_id: dictionary-data-admin
    route_prefix: /v1/system/dictionary-data
    aggregate: DictionaryData
    capability_ids:
      - create-dictionary-data
      - update-dictionary-data
      - batch-delete-dictionary-data
      - enquiry-dictionary-data-page
      - enquiry-dictionary-data-details
      - enquiry-dictionary-data-list-by-type
      - validate-dictionary-data-label
      - validate-dictionary-data-value

# semantic_ir: deterministic capability mapping
capabilities:
  - capability_id: create-dictionary-type
    semantic_intent: create-record
    deterministic_pattern: create
    stability_class: stable
    api_group: dictionary-type-admin
    http_method: POST
    route: /
    authority: system:dictionary-type:create
    transaction: read-write
    input_dto: CreateDictionaryTypeDto
    output_vo: Void
    touched_entities:
      - DictionaryType
      - DictionaryTypeTranslation
    invariants:
      - dictionary_type_code_unique
      - dictionary_type_name_unique_per_language
    generation_notes:
      - create root aggregate and localized fields in one write workflow
  - capability_id: update-dictionary-type
    semantic_intent: update-record
    deterministic_pattern: update
    stability_class: stable
    api_group: dictionary-type-admin
    http_method: PUT
    route: /
    authority: system:dictionary-type:update
    transaction: read-write
    input_dto: UpdateDictionaryTypeDto
    output_vo: Void
    touched_entities:
      - DictionaryType
      - DictionaryTypeTranslation
    invariants:
      - dictionary_type_identity_preserved
      - dictionary_type_code_unique
      - dictionary_type_name_unique_per_language
  - capability_id: batch-delete-dictionary-type
    semantic_intent: delete-record
    deterministic_pattern: batch-delete
    stability_class: stable
    api_group: dictionary-type-admin
    http_method: DELETE
    route: /
    authority: system:dictionary-type:delete
    transaction: read-write
    input_dto: DictionaryTypeIdSet
    output_vo: Void
    touched_entities:
      - DictionaryType
      - DictionaryTypeTranslation
    invariants:
      - batch_admin_delete_supported
  - capability_id: enquiry-dictionary-type-page
    semantic_intent: query-page
    deterministic_pattern: page
    stability_class: stable
    api_group: dictionary-type-admin
    http_method: GET
    route: /page
    authority: system:dictionary-type:page
    transaction: read-only
    input_dto: EnquiryDictionaryTypePageDto
    output_vo: PageVo<DictionaryTypePageVo>
    touched_entities:
      - DictionaryType
      - DictionaryTypeTranslation
    invariants:
      - repository_pagination_pattern_preserved
  - capability_id: enquiry-dictionary-type-details
    semantic_intent: query-details
    deterministic_pattern: details
    stability_class: stable
    api_group: dictionary-type-admin
    http_method: GET
    route: /{id}
    authority: system:dictionary-type:details
    transaction: read-only
    input_dto: DictionaryTypeIdPath
    output_vo: DictionaryTypeDetailsVo
    touched_entities:
      - DictionaryType
      - DictionaryTypeTranslation
  - capability_id: enquiry-dictionary-type-list
    semantic_intent: query-list
    deterministic_pattern: list
    stability_class: stable
    api_group: dictionary-type-admin
    http_method: GET
    route: /list
    authority: system:dictionary-type:list
    transaction: read-only
    input_dto: None
    output_vo: List<DictionaryTypeListVo>
    touched_entities:
      - DictionaryType
      - DictionaryTypeTranslation
  - capability_id: validate-dictionary-type-name
    semantic_intent: unique-validation
    deterministic_pattern: uniqueness-check
    stability_class: stable
    api_group: dictionary-type-admin
    http_method: GET
    route: /dictionary-type-name/unique
    authority: system:dictionary-type:validate-dictionary-type-name
    transaction: read-only
    input_dto: ValidateDictionaryTypeNameUniqueDto
    output_vo: Boolean
    touched_entities:
      - DictionaryTypeTranslation
    invariants:
      - dictionary_type_name_unique_per_language
  - capability_id: validate-dictionary-type-code
    semantic_intent: unique-validation
    deterministic_pattern: uniqueness-check
    stability_class: stable
    api_group: dictionary-type-admin
    http_method: GET
    route: /dictionary-type-code/unique
    authority: system:dictionary-type:validate-dictionary-type-code
    transaction: read-only
    input_dto: ValidateDictionaryTypeCodeUniqueDto
    output_vo: Boolean
    touched_entities:
      - DictionaryType
    invariants:
      - dictionary_type_code_unique
  - capability_id: create-dictionary-data
    semantic_intent: create-record
    deterministic_pattern: create
    stability_class: stable
    api_group: dictionary-data-admin
    http_method: POST
    route: /
    authority: system:dictionary-data:create
    transaction: read-write
    input_dto: CreateDictionaryDataDto
    output_vo: Void
    touched_entities:
      - DictionaryData
      - DictionaryDataTranslation
      - DictionaryType
    invariants:
      - parent_dictionary_type_must_exist
      - dictionary_data_label_unique_per_language_and_type
      - dictionary_data_value_unique_per_type
  - capability_id: update-dictionary-data
    semantic_intent: update-record
    deterministic_pattern: update
    stability_class: stable
    api_group: dictionary-data-admin
    http_method: PUT
    route: /
    authority: system:dictionary-data:update
    transaction: read-write
    input_dto: UpdateDictionaryDataDto
    output_vo: Void
    touched_entities:
      - DictionaryData
      - DictionaryDataTranslation
      - DictionaryType
    invariants:
      - dictionary_data_identity_preserved
      - parent_dictionary_type_must_exist
      - dictionary_data_label_unique_per_language_and_type
      - dictionary_data_value_unique_per_type
  - capability_id: batch-delete-dictionary-data
    semantic_intent: delete-record
    deterministic_pattern: batch-delete
    stability_class: stable
    api_group: dictionary-data-admin
    http_method: DELETE
    route: /
    authority: system:dictionary-data:delete
    transaction: read-write
    input_dto: DictionaryDataIdSet
    output_vo: Void
    touched_entities:
      - DictionaryData
      - DictionaryDataTranslation
    invariants:
      - batch_admin_delete_supported
  - capability_id: enquiry-dictionary-data-page
    semantic_intent: query-page
    deterministic_pattern: page
    stability_class: stable
    api_group: dictionary-data-admin
    http_method: GET
    route: /page
    authority: system:dictionary-data:page
    transaction: read-only
    input_dto: EnquiryDictionaryDataPageDto
    output_vo: PageVo<DictionaryDataPageVo>
    touched_entities:
      - DictionaryData
      - DictionaryDataTranslation
      - DictionaryType
    invariants:
      - repository_pagination_pattern_preserved
  - capability_id: enquiry-dictionary-data-details
    semantic_intent: query-details
    deterministic_pattern: details
    stability_class: stable
    api_group: dictionary-data-admin
    http_method: GET
    route: /{id}
    authority: system:dictionary-data:details
    transaction: read-only
    input_dto: DictionaryDataIdPath
    output_vo: DictionaryDataDetailsVo
    touched_entities:
      - DictionaryData
      - DictionaryDataTranslation
      - DictionaryType
  - capability_id: enquiry-dictionary-data-list-by-type
    semantic_intent: query-list
    deterministic_pattern: list
    stability_class: stable
    api_group: dictionary-data-admin
    http_method: GET
    route: /list/{dictionaryTypeCode}
    authority: system:dictionary-data:list
    transaction: read-only
    input_dto: DictionaryTypeCodePath
    output_vo: List<DictionaryDataListVo>
    touched_entities:
      - DictionaryData
      - DictionaryDataTranslation
      - DictionaryType
    invariants:
      - lightweight_option_output_only
      - parent_dictionary_type_resolved_by_code
  - capability_id: validate-dictionary-data-label
    semantic_intent: unique-validation
    deterministic_pattern: uniqueness-check
    stability_class: stable
    api_group: dictionary-data-admin
    http_method: GET
    route: /label/unique
    authority: system:dictionary-data:validate-label
    transaction: read-only
    input_dto: ValidateDictionaryDataLabelUniqueDto
    output_vo: Boolean
    touched_entities:
      - DictionaryDataTranslation
      - DictionaryType
    invariants:
      - dictionary_data_label_unique_per_language_and_type
  - capability_id: validate-dictionary-data-value
    semantic_intent: unique-validation
    deterministic_pattern: uniqueness-check
    stability_class: stable
    api_group: dictionary-data-admin
    http_method: GET
    route: /value/unique
    authority: system:dictionary-data:validate-value
    transaction: read-only
    input_dto: ValidateDictionaryDataValueUniqueDto
    output_vo: Boolean
    touched_entities:
      - DictionaryData
      - DictionaryType
    invariants:
      - dictionary_data_value_unique_per_type

# semantic_ir: entity ownership and relation graph
entity_graph:
  entities:
    - entity_id: DictionaryType
      table: system_dictionary_type
      ownership: owned
      base_type: PrimaryKeyEntity
      aggregate_role: root
      relations:
        - relation: one-to-many
          target: DictionaryTypeTranslation
          relation_name: translations
        - relation: one-to-many
          target: DictionaryData
          relation_name: data_items
    - entity_id: DictionaryTypeTranslation
      table: system_dictionary_type_translation
      ownership: owned
      base_type: none
      aggregate_role: translation-child
      relations:
        - relation: many-to-one
          target: DictionaryType
          relation_name: parent_type
    - entity_id: DictionaryData
      table: system_dictionary_data
      ownership: owned
      base_type: PrimaryKeyEntity
      aggregate_role: child-root
      relations:
        - relation: many-to-one
          target: DictionaryType
          relation_name: parent_type
        - relation: one-to-many
          target: DictionaryDataTranslation
          relation_name: translations
    - entity_id: DictionaryDataTranslation
      table: system_dictionary_data_translation
      ownership: owned
      base_type: none
      aggregate_role: translation-child
      relations:
        - relation: many-to-one
          target: DictionaryData
          relation_name: parent_data

# regeneration_constraint: generated artifact family
artifact_contract:
  resource:
    - DictionaryTypeResource
    - DictionaryDataResource
  manager:
    - DictionaryTypeManager
    - DictionaryDataManager
  service:
    - DictionaryTypeService
    - DictionaryTypeTranslationService
    - DictionaryDataService
    - DictionaryDataTranslationService
  service_impl:
    - DictionaryTypeServiceImpl
    - DictionaryTypeTranslationServiceImpl
    - DictionaryDataServiceImpl
    - DictionaryDataTranslationServiceImpl
  mapper:
    - DictionaryTypeMapper
    - DictionaryTypeTranslationMapper
    - DictionaryDataMapper
    - DictionaryDataTranslationMapper
  entity:
    - DictionaryTypeEntity
    - DictionaryTypeTranslationEntity
    - DictionaryDataEntity
    - DictionaryDataTranslationEntity
  dto:
    - CreateDictionaryTypeDto
    - UpdateDictionaryTypeDto
    - EnquiryDictionaryTypePageDto
    - ValidateDictionaryTypeNameUniqueDto
    - ValidateDictionaryTypeCodeUniqueDto
    - CreateDictionaryDataDto
    - UpdateDictionaryDataDto
    - EnquiryDictionaryDataPageDto
    - ValidateDictionaryDataLabelUniqueDto
    - ValidateDictionaryDataValueUniqueDto
  vo:
    - DictionaryTypeDetailsVo
    - DictionaryTypePageVo
    - DictionaryTypeListVo
    - DictionaryDataDetailsVo
    - DictionaryDataPageVo
    - DictionaryDataListVo
  bo: []

# regeneration_constraint: compile-time validation targets
validation_rules:
  uniqueness:
    - rule_id: dictionary_type_code_unique
      scope: system_dictionary_type.dictionary_type_code
    - rule_id: dictionary_type_name_unique_per_language
      scope: system_dictionary_type_translation.(language_code, dictionary_type_name)
    - rule_id: dictionary_data_label_unique_per_language_and_type
      scope: system_dictionary_data_translation.(language_code, label, dictionary_type_code)
    - rule_id: dictionary_data_value_unique_per_type
      scope: system_dictionary_data.(dictionary_type_code, value)
  referential:
    - rule_id: parent_dictionary_type_must_exist
      source: DictionaryData.dictionary_type_code
      target: DictionaryType.dictionary_type_code
  shape:
    - rule_id: lightweight_option_output_only
      target_capability: enquiry-dictionary-data-list-by-type
    - rule_id: repository_pagination_pattern_preserved
      target_capability:
        - enquiry-dictionary-type-page
        - enquiry-dictionary-data-page

# regeneration_constraint: repository architecture preservation
architecture_constraints:
  modular_monolith_mode: true
  package_layout_must_match_siblings: true
  response_wrapper_must_be: ResponseVo
  page_wrapper_must_be: PageVo
  mutation_logging_required_for:
    - create-dictionary-type
    - update-dictionary-type
    - batch-delete-dictionary-type
    - create-dictionary-data
    - update-dictionary-data
    - batch-delete-dictionary-data
  security_annotation_required: true
  security_style:
    type: preauthorize-authority
    authority_prefixes:
      - system:dictionary-type:
      - system:dictionary-data:
  transaction_boundary: manager-boundary
  controller_suffix: Resource
  manager_suffix: Manager

# architecture_discovery_hint: persistence and query conventions
persistence_conventions:
  framework: mybatis-flex
  database: mysql
  query_style:
    page_queries_use_enquiry_dto: true
    detail_queries_use_path_id: true
    list_queries_may_use_path_code: true
  translation_model:
    separate_translation_tables: true
    localized_reads_required: true
  ownership_model:
    root_and_translation_split: true
    child_data_bound_to_type: true

# semantic_ir: localization behavior required by generators and validators
localization_requirements:
  mandatory: true
  languages:
    - zh-CN
    - en-US
  localized_aggregates:
    - DictionaryType
    - DictionaryData
  localized_fields:
    DictionaryType:
      - dictionary_type_name
      - remark
    DictionaryData:
      - label
      - remark
  fallback_policy: repository-locale-resolution

# semantic_ir: audit behavior for integration agents
audit_behavior:
  access_log: none
  operate_log:
    enabled: true
    target_capabilities:
      - create-dictionary-type
      - update-dictionary-type
      - batch-delete-dictionary-type
      - create-dictionary-data
      - update-dictionary-data
      - batch-delete-dictionary-data
    titles:
      create-dictionary-type: Create Dictionary Type
      update-dictionary-type: Update Dictionary Type
      batch-delete-dictionary-type: Batch Delete Dictionary Types
      create-dictionary-data: Create Dictionary Data
      update-dictionary-data: Update Dictionary Data
      batch-delete-dictionary-data: Batch Delete Dictionary Data

# regeneration_constraint: final hard constraints for planners, generators, validators
generation_contract:
  deterministic_output_required: true
  sibling_pattern_priority: system.user,system.role,system.permission
  preserve_project_contracts:
    - multilingual-translation-model
    - administrative-crud-consistency
    - centralized-authority-based-security
    - modular-monolith-boundaries
  dag_compatibility:
    isolated_node: true
    explicit_dependencies_only: true
    no_hidden_cross_module_coupling: true
