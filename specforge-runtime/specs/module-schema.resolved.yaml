resolution_context:
  source_module_spec: module-spec.yaml
  resolved_schema_id: insurance-policy-management-resolved-v1
  target_module_id: insurance-policy-management
  bounded_context: insurance-policy-operations
  regeneration_mode: create
  stability_goal: deterministic
  compiler_stage: resolved-generation-plan
  dag_compatible: true
  multi_agent_safe: true

module_identity:
  module_name: insurance-policy-management
  semantic_role: business-domain
  responsibility_code: insurance-policy-operations
  package_root: org.eu.originalkeen.business.insurancepolicy
  route_roots:
    - /v1/business/insurance-product
    - /v1/business/insurance-policy
  repository_binding:
    nearest_siblings:
      - org.eu.originalkeen.business.personal
      - org.eu.originalkeen.system.user
      - org.eu.originalkeen.system.dictionary
    layering_model: resource-manager-service-mapper
    response_wrapper: ResponseVo
    page_wrapper: PageVo
    persistence_framework: mybatis-flex
    security_binding: preauthorize-authority
    mutation_logging_binding: operate-log
    transaction_binding: manager-boundary

api_groups:
  - group_id: insurance-product-admin
    route_prefix: /v1/business/insurance-product
    aggregate: InsuranceProduct
    capability_ids:
      - create-insurance-product
      - update-insurance-product
      - batch-delete-insurance-product
      - enquiry-insurance-product-page
      - enquiry-insurance-product-details
      - enquiry-insurance-product-list
  - group_id: insurance-policy-admin
    route_prefix: /v1/business/insurance-policy
    aggregate: InsurancePolicy
    capability_ids:
      - create-insurance-policy
      - update-insurance-policy
      - batch-delete-insurance-policy
      - enquiry-insurance-policy-page
      - enquiry-insurance-policy-details
      - enquiry-insurance-policy-list

capabilities:
  - capability_id: create-insurance-product
    normalized_group: insurance-product-write
    semantic_intent: create-record
    deterministic_pattern: create
    execution_kind: mutation
    aggregate_scope: InsuranceProduct
    api_group: insurance-product-admin
    route_binding:
      resource: InsuranceProductResource
      method: create
      http_method: POST
      path: /v1/business/insurance-product
    authority: business:insurance-product:create
    authority_binding: business:insurance-product:create
    transaction_mode: read-write
    input_contract:
      dto: CreateInsuranceProductDto
      validation_rules:
        - insurance_product_code_unique
        - insurance_product_name_unique
    output_contract:
      wrapper: ResponseVo
      payload: Void
    touched_entities:
      - InsuranceProduct
  - capability_id: update-insurance-product
    normalized_group: insurance-product-write
    semantic_intent: update-record
    deterministic_pattern: update
    execution_kind: mutation
    aggregate_scope: InsuranceProduct
    api_group: insurance-product-admin
    route_binding:
      resource: InsuranceProductResource
      method: update
      http_method: PUT
      path: /v1/business/insurance-product
    authority: business:insurance-product:update
    authority_binding: business:insurance-product:update
    transaction_mode: read-write
    input_contract:
      dto: UpdateInsuranceProductDto
      validation_rules:
        - insurance_product_code_unique
        - insurance_product_name_unique
    output_contract:
      wrapper: ResponseVo
      payload: Void
    touched_entities:
      - InsuranceProduct
  - capability_id: batch-delete-insurance-product
    normalized_group: insurance-product-write
    semantic_intent: delete-record
    deterministic_pattern: batch-delete
    execution_kind: mutation
    aggregate_scope: InsuranceProduct
    api_group: insurance-product-admin
    route_binding:
      resource: InsuranceProductResource
      method: batchDelete
      http_method: DELETE
      path: /v1/business/insurance-product
    authority: business:insurance-product:delete
    authority_binding: business:insurance-product:delete
    transaction_mode: read-write
    input_contract:
      dto: InsuranceProductIdSet
      validation_rules: []
    output_contract:
      wrapper: ResponseVo
      payload: Void
    touched_entities:
      - InsuranceProduct
  - capability_id: enquiry-insurance-product-page
    normalized_group: insurance-product-read
    semantic_intent: query-page
    deterministic_pattern: page
    execution_kind: query
    aggregate_scope: InsuranceProduct
    api_group: insurance-product-admin
    route_binding:
      resource: InsuranceProductResource
      method: enquiryPage
      http_method: GET
      path: /v1/business/insurance-product/page
    authority: business:insurance-product:page
    authority_binding: business:insurance-product:page
    transaction_mode: read-only
    input_contract:
      dto: EnquiryInsuranceProductPageDto
      validation_rules:
        - repository_pagination_pattern_preserved
    output_contract:
      wrapper: ResponseVo
      payload: PageVo<InsuranceProductPageVo>
    touched_entities:
      - InsuranceProduct
  - capability_id: enquiry-insurance-product-details
    normalized_group: insurance-product-read
    semantic_intent: query-details
    deterministic_pattern: details
    execution_kind: query
    aggregate_scope: InsuranceProduct
    api_group: insurance-product-admin
    route_binding:
      resource: InsuranceProductResource
      method: enquiryDetails
      http_method: GET
      path: /v1/business/insurance-product/{id}
    authority: business:insurance-product:details
    authority_binding: business:insurance-product:details
    transaction_mode: read-only
    input_contract:
      dto: InsuranceProductIdPath
      validation_rules: []
    output_contract:
      wrapper: ResponseVo
      payload: InsuranceProductDetailsVo
    touched_entities:
      - InsuranceProduct
  - capability_id: enquiry-insurance-product-list
    normalized_group: insurance-product-read
    semantic_intent: query-list
    deterministic_pattern: list
    execution_kind: query
    aggregate_scope: InsuranceProduct
    api_group: insurance-product-admin
    route_binding:
      resource: InsuranceProductResource
      method: enquiryList
      http_method: GET
      path: /v1/business/insurance-product/list
    authority: business:insurance-product:list
    authority_binding: business:insurance-product:list
    transaction_mode: read-only
    input_contract:
      dto: None
      validation_rules: []
    output_contract:
      wrapper: ResponseVo
      payload: List<InsuranceProductListVo>
    touched_entities:
      - InsuranceProduct
  - capability_id: create-insurance-policy
    normalized_group: insurance-policy-write
    semantic_intent: create-record
    deterministic_pattern: create
    execution_kind: mutation
    aggregate_scope: InsurancePolicy
    api_group: insurance-policy-admin
    route_binding:
      resource: InsurancePolicyResource
      method: create
      http_method: POST
      path: /v1/business/insurance-policy
    authority: business:insurance-policy:create
    authority_binding: business:insurance-policy:create
    transaction_mode: read-write
    input_contract:
      dto: CreateInsurancePolicyDto
      validation_rules:
        - insurance_policy_number_unique
        - insurance_policy_product_must_exist
    output_contract:
      wrapper: ResponseVo
      payload: Void
    touched_entities:
      - InsurancePolicy
      - InsuranceProduct
  - capability_id: update-insurance-policy
    normalized_group: insurance-policy-write
    semantic_intent: update-record
    deterministic_pattern: update
    execution_kind: mutation
    aggregate_scope: InsurancePolicy
    api_group: insurance-policy-admin
    route_binding:
      resource: InsurancePolicyResource
      method: update
      http_method: PUT
      path: /v1/business/insurance-policy
    authority: business:insurance-policy:update
    authority_binding: business:insurance-policy:update
    transaction_mode: read-write
    input_contract:
      dto: UpdateInsurancePolicyDto
      validation_rules:
        - insurance_policy_number_unique
        - insurance_policy_product_must_exist
    output_contract:
      wrapper: ResponseVo
      payload: Void
    touched_entities:
      - InsurancePolicy
      - InsuranceProduct
  - capability_id: batch-delete-insurance-policy
    normalized_group: insurance-policy-write
    semantic_intent: delete-record
    deterministic_pattern: batch-delete
    execution_kind: mutation
    aggregate_scope: InsurancePolicy
    api_group: insurance-policy-admin
    route_binding:
      resource: InsurancePolicyResource
      method: batchDelete
      http_method: DELETE
      path: /v1/business/insurance-policy
    authority: business:insurance-policy:delete
    authority_binding: business:insurance-policy:delete
    transaction_mode: read-write
    input_contract:
      dto: InsurancePolicyIdSet
      validation_rules: []
    output_contract:
      wrapper: ResponseVo
      payload: Void
    touched_entities:
      - InsurancePolicy
  - capability_id: enquiry-insurance-policy-page
    normalized_group: insurance-policy-read
    semantic_intent: query-page
    deterministic_pattern: page
    execution_kind: query
    aggregate_scope: InsurancePolicy
    api_group: insurance-policy-admin
    route_binding:
      resource: InsurancePolicyResource
      method: enquiryPage
      http_method: GET
      path: /v1/business/insurance-policy/page
    authority: business:insurance-policy:page
    authority_binding: business:insurance-policy:page
    transaction_mode: read-only
    input_contract:
      dto: EnquiryInsurancePolicyPageDto
      validation_rules:
        - repository_pagination_pattern_preserved
    output_contract:
      wrapper: ResponseVo
      payload: PageVo<InsurancePolicyPageVo>
    touched_entities:
      - InsurancePolicy
      - InsuranceProduct
  - capability_id: enquiry-insurance-policy-details
    normalized_group: insurance-policy-read
    semantic_intent: query-details
    deterministic_pattern: details
    execution_kind: query
    aggregate_scope: InsurancePolicy
    api_group: insurance-policy-admin
    route_binding:
      resource: InsurancePolicyResource
      method: enquiryDetails
      http_method: GET
      path: /v1/business/insurance-policy/{id}
    authority: business:insurance-policy:details
    authority_binding: business:insurance-policy:details
    transaction_mode: read-only
    input_contract:
      dto: InsurancePolicyIdPath
      validation_rules: []
    output_contract:
      wrapper: ResponseVo
      payload: InsurancePolicyDetailsVo
    touched_entities:
      - InsurancePolicy
      - InsuranceProduct
  - capability_id: enquiry-insurance-policy-list
    normalized_group: insurance-policy-read
    semantic_intent: query-list
    deterministic_pattern: list
    execution_kind: query
    aggregate_scope: InsurancePolicy
    api_group: insurance-policy-admin
    route_binding:
      resource: InsurancePolicyResource
      method: enquiryList
      http_method: GET
      path: /v1/business/insurance-policy/list
    authority: business:insurance-policy:list
    authority_binding: business:insurance-policy:list
    transaction_mode: read-only
    input_contract:
      dto: None
      validation_rules: []
    output_contract:
      wrapper: ResponseVo
      payload: List<InsurancePolicyListVo>
    touched_entities:
      - InsurancePolicy
      - InsuranceProduct

entity_graph:
  entities:
    - entity_id: InsuranceProduct
      table: insurance_product
      ownership: owned
      base_type: PrimaryKeyEntity
      aggregate_role: root
      relations:
        - relation: one-to-many
          target: InsurancePolicy
          relation_name: policies
    - entity_id: InsurancePolicy
      table: insurance_policy
      ownership: owned
      base_type: PrimaryKeyEntity
      aggregate_role: child-root
      relations:
        - relation: many-to-one
          target: InsuranceProduct
          relation_name: insuranceProduct

validation_rules:
  uniqueness:
    - rule_id: insurance_product_code_unique
      scope: insurance_product.insurance_product_code
    - rule_id: insurance_product_name_unique
      scope: insurance_product.insurance_product_name
    - rule_id: insurance_policy_number_unique
      scope: insurance_policy.insurance_policy_number
  referential:
    - rule_id: insurance_policy_product_must_exist
      source: InsurancePolicy.insurance_product_id
      target: InsuranceProduct.id
  shape:
    - rule_id: repository_pagination_pattern_preserved
      target_capability:
        - enquiry-insurance-product-page
        - enquiry-insurance-policy-page

architectural_bindings:
  code_conventions:
    resource_suffix: Resource
    manager_suffix: Manager
    service_suffix: Service
    service_impl_suffix: ServiceImpl
    mapper_suffix: Mapper
    entity_suffix: Entity
    dto_prefixes:
      create: Create
      update: Update
      enquiry_page: Enquiry
    vo_suffixes:
      details: DetailsVo
      page: PageVo
      list: ListVo
  annotation_bindings:
    resource_annotations:
      - "@CrossOrigin"
      - "@Validated"
      - "@RestController"
      - "@RequestMapping"
    mutation_annotations:
      - "@PreAuthorize"
      - "@OperateLog"
    query_annotations:
      - "@PreAuthorize"
    dependency_injection: "@Resource"
  response_bindings:
    wrapper_type: ResponseVo
    page_type: PageVo
    mutation_payload: Void
  persistence_bindings:
    framework: mybatis-flex
    aggregate_identity_style: primary-key-entity

persistence_conventions:
  framework: mybatis-flex
  database: mysql
  query_style:
    page_queries_use_enquiry_dto: true
    detail_queries_use_path_id: true
    list_queries_use_simple_collection_read: true
  ownership_model:
    insurance_product_as_parent_reference: true
    insurance_policy_belongs_to_product: true

localization_requirements:
  mandatory: false
  languages: []
  localized_aggregates: []
  localized_fields: {}
  fallback_policy: none

audit_behavior:
  access_log: none
  operate_log:
    enabled: true
    target_capabilities:
      - create-insurance-product
      - update-insurance-product
      - batch-delete-insurance-product
      - create-insurance-policy
      - update-insurance-policy
      - batch-delete-insurance-policy

integration_points:
  security:
    mode: centralized-method-security
    authority_families:
      - business:insurance-product:*
      - business:insurance-policy:*
  logging:
    mode: operate-log-aspect
    mutation_only: true
  persistence:
    database: mysql
    required_tables:
      - insurance_product
      - insurance_policy

code_conventions:
  naming_stability: strict
  route_style: sibling-module-aligned
  transaction_style: manager-boundary
  uniqueness_validation_style: service-guard
  list_vs_page_distinction: mandatory

validation_hooks:
  pre_generation:
    - hook-discovery-baseline-complete
  post_unit:
    - hook-artifact-name-convention
    - hook-package-placement-check
  final:
    - hook-module-boundary-check
    - hook-deterministic-layout-check
