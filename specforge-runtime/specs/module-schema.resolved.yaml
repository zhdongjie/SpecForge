# semantic_ir: compiler resolution context
resolution_context:
  source_module_spec: module-spec.yaml
  resolved_schema_id: dictionary-management-resolved-v1
  target_module_id: dictionary-management
  bounded_context: system-administration
  regeneration_mode: create
  stability_goal: deterministic
  compiler_stage: resolved-generation-plan
  dag_compatible: true
  multi_agent_safe: true

# semantic_ir: normalized module identity after binding to repository conventions
module_identity:
  module_name: dictionary-management
  semantic_role: admin-domain
  responsibility_code: reference-data-localization
  package_root: org.eu.originalkeen.system.dictionary
  route_roots:
    - /v1/system/dictionary-type
    - /v1/system/dictionary-data
  repository_binding:
    nearest_siblings:
      - org.eu.originalkeen.system.user
      - org.eu.originalkeen.system.role
      - org.eu.originalkeen.system.permission
    layering_model: resource-manager-service-mapper
    response_wrapper: ResponseVo
    page_wrapper: PageVo
    persistence_framework: mybatis-flex
    security_binding: preauthorize-authority
    mutation_logging_binding: operate-log
    transaction_binding: manager-boundary

# semantic_ir: normalized capability expansion used by planners and generators
normalized_capabilities:
  - capability_id: create-dictionary-type
    normalized_group: dictionary-type-write
    semantic_intent: create-record
    deterministic_pattern: create
    execution_kind: mutation
    aggregate_scope: DictionaryType
    route_binding:
      resource: DictionaryTypeResource
      method: create
      http_method: POST
      path: /v1/system/dictionary-type
    authority_binding: system:dictionary-type:create
    transaction_mode: read-write
    input_contract:
      dto: CreateDictionaryTypeDto
      validation_rules:
        - dictionary_type_code_unique
        - dictionary_type_name_unique_per_language
    output_contract:
      wrapper: ResponseVo
      payload: Void
    touched_artifacts:
      - DictionaryTypeManager
      - DictionaryTypeService
      - DictionaryTypeTranslationService
      - DictionaryTypeMapper
      - DictionaryTypeTranslationMapper
      - DictionaryTypeEntity
      - DictionaryTypeTranslationEntity
    prerequisite_units:
      - shared-dictionary-type-domain
      - shared-dictionary-type-persistence
      - shared-dictionary-type-service
    validation_hooks:
      - hook-capability-route-match
      - hook-uniqueness-prewrite
      - hook-operate-log-binding
  - capability_id: update-dictionary-type
    normalized_group: dictionary-type-write
    semantic_intent: update-record
    deterministic_pattern: update
    execution_kind: mutation
    aggregate_scope: DictionaryType
    route_binding:
