# semantic_ir: resolved artifact inventory with implementation-aware binding
resolved_artifacts:
  shared_units:
    - unit_id: shared-dictionary-type-domain
      artifacts:
        dto:
          - CreateDictionaryTypeDto
          - UpdateDictionaryTypeDto
          - EnquiryDictionaryTypePageDto
          - ValidateDictionaryTypeNameUniqueDto
          - ValidateDictionaryTypeCodeUniqueDto
        vo:
          - DictionaryTypeDetailsVo
          - DictionaryTypePageVo
          - DictionaryTypeListVo
        entity:
          - DictionaryTypeEntity
          - DictionaryTypeTranslationEntity
    - unit_id: shared-dictionary-type-persistence
      artifacts:
        mapper:
          - DictionaryTypeMapper
          - DictionaryTypeTranslationMapper
    - unit_id: shared-dictionary-type-service
      artifacts:
        service:
          - DictionaryTypeService
          - DictionaryTypeTranslationService
        service_impl:
          - DictionaryTypeServiceImpl
          - DictionaryTypeTranslationServiceImpl
        manager:
          - DictionaryTypeManager
        resource:
          - DictionaryTypeResource
    - unit_id: shared-dictionary-data-domain
      artifacts:
        dto:
          - CreateDictionaryDataDto
          - UpdateDictionaryDataDto
          - EnquiryDictionaryDataPageDto
          - ValidateDictionaryDataLabelUniqueDto
          - ValidateDictionaryDataValueUniqueDto
        vo:
          - DictionaryDataDetailsVo
          - DictionaryDataPageVo
          - DictionaryDataListVo
        entity:
          - DictionaryDataEntity
          - DictionaryDataTranslationEntity
    - unit_id: shared-dictionary-data-persistence
      artifacts:
        mapper:
          - DictionaryDataMapper
          - DictionaryDataTranslationMapper
    - unit_id: shared-dictionary-data-service
      artifacts:
        service:
          - DictionaryDataService
          - DictionaryDataTranslationService
        service_impl:
          - DictionaryDataServiceImpl
          - DictionaryDataTranslationServiceImpl
        manager:
          - DictionaryDataManager
        resource:
          - DictionaryDataResource

# semantic_ir: executable generation units for DAG or multi-agent scheduling
generation_units:
  - unit_id: U1-dictionary-type-domain
    kind: domain
    scope: DictionaryType
    produces:
      - CreateDictionaryTypeDto
      - UpdateDictionaryTypeDto
      - EnquiryDictionaryTypePageDto
      - ValidateDictionaryTypeNameUniqueDto
      - ValidateDictionaryTypeCodeUniqueDto
      - DictionaryTypeDetailsVo
      - DictionaryTypePageVo
      - DictionaryTypeListVo
      - DictionaryTypeEntity
      - DictionaryTypeTranslationEntity
    depends_on: []
  - unit_id: U2-dictionary-type-persistence
    kind: persistence
    scope: DictionaryType
    produces:
      - DictionaryTypeMapper
      - DictionaryTypeTranslationMapper
    depends_on:
      - U1-dictionary-type-domain
  - unit_id: U3-dictionary-type-services
    kind: service-layer
    scope: DictionaryType
    produces:
      - DictionaryTypeService
      - DictionaryTypeTranslationService
      - DictionaryTypeServiceImpl
      - DictionaryTypeTranslationServiceImpl
      - DictionaryTypeManager
    depends_on:
      - U1-dictionary-type-domain
      - U2-dictionary-type-persistence
  - unit_id: U4-dictionary-type-resource
    kind: resource-layer
    scope: DictionaryType
    produces:
      - DictionaryTypeResource
    depends_on:
      - U3-dictionary-type-services
  - unit_id: U5-dictionary-data-domain
    kind: domain
    scope: DictionaryData
    produces:
      - CreateDictionaryDataDto
      - UpdateDictionaryDataDto
      - EnquiryDictionaryDataPageDto
      - ValidateDictionaryDataLabelUniqueDto
      - ValidateDictionaryDataValueUniqueDto
      - DictionaryDataDetailsVo
      - DictionaryDataPageVo
      - DictionaryDataListVo
      - DictionaryDataEntity
      - DictionaryDataTranslationEntity
    depends_on:
      - U1-dictionary-type-domain
  - unit_id: U6-dictionary-data-persistence
    kind: persistence
    scope: DictionaryData
    produces:
      - DictionaryDataMapper
      - DictionaryDataTranslationMapper
    depends_on:
      - U5-dictionary-data-domain
  - unit_id: U7-dictionary-data-services
    kind: service-layer
    scope: DictionaryData
    produces:
      - DictionaryDataService
      - DictionaryDataTranslationService
      - DictionaryDataServiceImpl
      - DictionaryDataTranslationServiceImpl
      - DictionaryDataManager
    depends_on:
      - U3-dictionary-type-services
      - U5-dictionary-data-domain
      - U6-dictionary-data-persistence
  - unit_id: U8-dictionary-data-resource
    kind: resource-layer
    scope: DictionaryData
    produces:
      - DictionaryDataResource
    depends_on:
      - U7-dictionary-data-services

# semantic_ir: graph for planners and orchestration engines
dependency_graph:
  nodes:
    - U1-dictionary-type-domain
    - U2-dictionary-type-persistence
    - U3-dictionary-type-services
    - U4-dictionary-type-resource
    - U5-dictionary-data-domain
    - U6-dictionary-data-persistence
    - U7-dictionary-data-services
    - U8-dictionary-data-resource
  edges:
    - from: U1-dictionary-type-domain
      to: U2-dictionary-type-persistence
    - from: U1-dictionary-type-domain
      to: U3-dictionary-type-services
    - from: U3-dictionary-type-services
      to: U4-dictionary-type-resource
    - from: U1-dictionary-type-domain
      to: U5-dictionary-data-domain
    - from: U5-dictionary-data-domain
      to: U6-dictionary-data-persistence
    - from: U3-dictionary-type-services
      to: U7-dictionary-data-services
    - from: U5-dictionary-data-domain
      to: U7-dictionary-data-services
    - from: U6-dictionary-data-persistence
      to: U7-dictionary-data-services
    - from: U7-dictionary-data-services
      to: U8-dictionary-data-resource

# semantic_ir: deterministic topological order
generation_order:
  sequential:
    - U1-dictionary-type-domain
    - U2-dictionary-type-persistence
    - U3-dictionary-type-services
    - U4-dictionary-type-resource
    - U5-dictionary-data-domain
    - U6-dictionary-data-persistence
    - U7-dictionary-data-services
    - U8-dictionary-data-resource
  parallel_batches:
    - batch_id: B1
      units:
        - U1-dictionary-type-domain
    - batch_id: B2
      units:
        - U2-dictionary-type-persistence
        - U5-dictionary-data-domain
    - batch_id: B3
      units:
        - U3-dictionary-type-services
        - U6-dictionary-data-persistence
    - batch_id: B4
      units:
        - U4-dictionary-type-resource
        - U7-dictionary-data-services
    - batch_id: B5
      units:
        - U8-dictionary-data-resource

# implementation_aware: resolved architecture and code-level bindings
architectural_bindings:
  code_conventions:
    resource_suffix: Resource
    manager_suffix: Manager
    service_suffix: Service
    service_impl_suffix: ServiceImpl
    mapper_suffix: Mapper
    entity_suffix: Entity
    dto_prefixes:
      create: Create
      update: Update
      enquiry_page: Enquiry
      validate_unique: Validate
    vo_suffixes:
      details: DetailsVo
      page: PageVo
      list: ListVo
  annotation_bindings:
    resource_annotations:
      - "@CrossOrigin"
      - "@Validated when parameter validation exists"
      - "@RestController"
      - "@RequestMapping"
    mutation_annotations:
      - "@PreAuthorize"
      - "@OperateLog"
    query_annotations:
      - "@PreAuthorize"
    dependency_injection: "@Resource"
  response_bindings:
    wrapper_type: ResponseVo
    page_type: PageVo
    mutation_payload: Void
    unique_check_payload: Boolean
  persistence_bindings:
    framework: mybatis-flex
    translation_tables: separate
    aggregate_identity_style: primary-key-entity

# implementation_aware: explicit integration touchpoints
integration_points:
  security:
    mode: centralized-method-security
    authority_families:
      - system:dictionary-type:*
      - system:dictionary-data:*
  logging:
    mode: operate-log-aspect
    mutation_only: true
  localization:
    mode: translation-table-plus-locale-resolution
    required_languages:
      - zh-CN
      - en-US
  persistence:
    database: mysql
    required_tables:
      - system_dictionary_type
      - system_dictionary_type_translation
      - system_dictionary_data
      - system_dictionary_data_translation
  shared_kernel_dependencies:
    - ResponseVo
    - PageVo
    - OperateLog
    - PreAuthorize
    - global exception advice

# implementation_aware: code convention block for generators
code_conventions:
  naming_stability: strict
  route_style: sibling-module-aligned
  transaction_style: manager-boundary
  uniqueness_validation_style: dedicated-endpoint-plus-dto
  list_vs_page_distinction: mandatory
  translation_handling_style: aggregate-plus-translation-service
  batch_delete_style: collection-validated-delete-endpoint

# semantic_ir: validation hooks for validators and integration agents
validation_hooks:
  pre_generation:
    - hook-discovery-baseline-complete
    - hook-capability-taxonomy-resolved
    - hook-generation-boundary-single-module
  post_unit:
    - hook-artifact-name-convention
    - hook-package-placement-check
    - hook-annotation-binding-check
  post_capability:
    - hook-capability-route-match
    - hook-capability-authority-match
    - hook-capability-transaction-match
    - hook-output-wrapper-match
  post_integration:
    - hook-operate-log-binding
    - hook-localization-linkage-check
    - hook-foreign-reference-check
    - hook-page-wrapper-match
    - hook-lightweight-output-check
  final:
    - hook-module-boundary-check
    - hook-deterministic-layout-check
    - hook-dag-node-isolation-check
    - hook-generation-contract-check
