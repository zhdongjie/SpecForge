compiler_context:
  source_spec_id: score_management-project-v1
  target_module_id: score-management
  regeneration_mode: create
  stability_goal: deterministic
  planner_tags:
  - bounded-module
  - score-center
  - default-enabled-blueprint
module_identity:
  module_name: score-management
  bounded_context: score-center
  semantic_role: business-domain
  responsibility_code: score_management
  package_root: org.eu.originalkeen.business.score
  route_namespace:
    score-management: /v1/business/score
generation_boundaries:
  single_module_only: true
  owns_aggregates: &id001
  - StudentScore
  - ScoreImportTask
  may_reference:
  - ResponseVo
  - PageVo
  - OperateLog
  - PreAuthorize
  must_not_generate:
  - authentication flows
  - user management
  - role management
api_groups:
- group_id: score_management
  route_prefix: /v1/business/score
  aggregate: StudentScore
  capability_ids:
  - create-score_management
  - update-score_management
  - batch-delete-score_management
  - enquiry-score_management-page
  - enquiry-score_management-details
  - enquiry-score_management-list
capabilities:
- capability_id: create-score_management
  semantic_intent: create-record
  deterministic_pattern: create
  stability_class: stable
  api_group: score_management
  http_method: POST
  route: /
  authority: business:score:create
  transaction: read-write
  input_dto: CreateScoreManagementDto
  output_vo: Void
  touched_entities: *id001
- capability_id: update-score_management
  semantic_intent: update-record
  deterministic_pattern: update
  stability_class: stable
  api_group: score_management
  http_method: PUT
  route: /
  authority: business:score:update
  transaction: read-write
  input_dto: UpdateScoreManagementDto
  output_vo: Void
  touched_entities: *id001
- capability_id: batch-delete-score_management
  semantic_intent: delete-record
  deterministic_pattern: batch-delete
  stability_class: stable
  api_group: score_management
  http_method: DELETE
  route: /
  authority: business:score:delete
  transaction: read-write
  input_dto: ScoreManagementIdSet
  output_vo: Void
  touched_entities: *id001
- capability_id: enquiry-score_management-page
  semantic_intent: query-page
  deterministic_pattern: page
  stability_class: stable
  api_group: score_management
  http_method: GET
  route: /page
  authority: business:score:page
  transaction: read-only
  input_dto: EnquiryScoreManagementPageDto
  output_vo: PageVo<ScoreManagementPageVo>
  touched_entities: *id001
- capability_id: enquiry-score_management-details
  semantic_intent: query-details
  deterministic_pattern: details
  stability_class: stable
  api_group: score_management
  http_method: GET
  route: /{id}
  authority: business:score:details
  transaction: read-only
  input_dto: ScoreManagementIdPath
  output_vo: ScoreManagementDetailsVo
  touched_entities: *id001
- capability_id: enquiry-score_management-list
  semantic_intent: query-list
  deterministic_pattern: list
  stability_class: stable
  api_group: score_management
  http_method: GET
  route: /list
  authority: business:score:list
  transaction: read-only
  input_dto: None
  output_vo: List<ScoreManagementListVo>
  touched_entities: *id001
entity_graph:
  entities:
  - entity_id: StudentScore
    table: student_score
    ownership: owned
    base_type: PrimaryKeyEntity
    aggregate_role: root
    relations: []
  - entity_id: ScoreImportTask
    table: score_import_task
    ownership: owned
    base_type: PrimaryKeyEntity
    aggregate_role: root
    relations: []
artifact_contract:
  resource:
  - ScoreManagementResource
  manager:
  - ScoreManagementManager
  service:
  - ScoreManagementService
  service_impl:
  - ScoreManagementServiceImpl
  mapper:
  - ScoreManagementMapper
  entity: *id001
  dto:
  - CreateScoreManagementDto
  - UpdateScoreManagementDto
  - EnquiryScoreManagementPageDto
  vo:
  - ScoreManagementDetailsVo
  - ScoreManagementPageVo
  - ScoreManagementListVo
  bo: []
validation_rules:
  uniqueness: []
  referential: []
  shape: []
architecture_constraints:
  modular_monolith_mode: true
  response_wrapper_must_be: ResponseVo
  page_wrapper_must_be: PageVo
  security_annotation_required: true
persistence_conventions:
  framework: mybatis-flex
  database: mysql
localization_requirements:
  mandatory: false
  languages: []
  localized_aggregates: []
  localized_fields: {}
  fallback_policy: none
audit_behavior:
  access_log: none
  operate_log:
    enabled: true
    target_capabilities:
    - create-score_management
    - update-score_management
    - batch-delete-score_management
generation_contract:
  deterministic_output_required: true
  preserve_project_contracts:
  - modular-monolith-boundaries
  - centralized-authority-based-security
  blueprint_status: default-enabled-validated-blueprint
