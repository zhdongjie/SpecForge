  - update-enrollment_management
  - batch-delete-enrollment_management
  - enquiry-enrollment_management-page
  - enquiry-enrollment_management-details
  - enquiry-enrollment_management-list
capabilities:
- capability_id: create-enrollment_management
  semantic_intent: create-record
  deterministic_pattern: create
  stability_class: stable
  api_group: enrollment_management
  http_method: POST
  route: /
  authority: business:enrollment:create
  transaction: read-write
  input_dto: CreateEnrollmentManagementDto
  output_vo: Void
  touched_entities: *id001
- capability_id: update-enrollment_management
  semantic_intent: update-record
  deterministic_pattern: update
  stability_class: stable
  api_group: enrollment_management
  http_method: PUT
  route: /
  authority: business:enrollment:update
