compiler_context:
  source_spec_id: enrollment_management-project-v1
  target_module_id: enrollment-management
  regeneration_mode: create
  stability_goal: deterministic
  planner_tags:
  - bounded-module
  - enrollment-center
  - default-enabled-blueprint
module_identity:
  module_name: enrollment-management
  bounded_context: enrollment-center
  semantic_role: business-domain
  responsibility_code: enrollment_management
  package_root: org.eu.originalkeen.business.enrollment
  route_namespace:
    enrollment-management: /v1/business/enrollment
generation_boundaries:
