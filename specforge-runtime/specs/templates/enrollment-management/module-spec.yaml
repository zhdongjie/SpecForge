  stability_class: stable
  api_group: enrollment_management
  http_method: DELETE
  route: /
  authority: business:enrollment:delete
  transaction: read-write
  input_dto: EnrollmentManagementIdSet
  output_vo: Void
  touched_entities: *id001
- capability_id: enquiry-enrollment_management-page
  semantic_intent: query-page
  deterministic_pattern: page
  stability_class: stable
  api_group: enrollment_management
  http_method: GET
  route: /page
  authority: business:enrollment:page
  transaction: read-only
  input_dto: EnquiryEnrollmentManagementPageDto
  output_vo: PageVo<EnrollmentManagementPageVo>
  touched_entities: *id001
- capability_id: enquiry-enrollment_management-details
  semantic_intent: query-details
  deterministic_pattern: details
  stability_class: stable
  api_group: enrollment_management
  http_method: GET
  route: /{id}
  authority: business:enrollment:details
  transaction: read-only
  input_dto: EnrollmentManagementIdPath
  output_vo: EnrollmentManagementDetailsVo
  touched_entities: *id001
- capability_id: enquiry-enrollment_management-list
  semantic_intent: query-list
  deterministic_pattern: list
  stability_class: stable
  api_group: enrollment_management
  http_method: GET
  route: /list
  authority: business:enrollment:list
  transaction: read-only
  input_dto: None
  output_vo: List<EnrollmentManagementListVo>
  touched_entities: *id001
