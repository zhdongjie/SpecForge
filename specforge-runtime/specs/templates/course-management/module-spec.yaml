    ownership: owned
    base_type: PrimaryKeyEntity
    aggregate_role: root
    relations: []
  - entity_id: CourseCatalog
    table: course_catalog
    ownership: owned
    base_type: PrimaryKeyEntity
    aggregate_role: root
    relations: []
