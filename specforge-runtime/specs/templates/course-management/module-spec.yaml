  - update-course_management
  - batch-delete-course_management
  - enquiry-course_management-page
  - enquiry-course_management-details
  - enquiry-course_management-list
capabilities:
- capability_id: create-course_management
  semantic_intent: create-record
  deterministic_pattern: create
  stability_class: stable
  api_group: course_management
  http_method: POST
  route: /
  authority: business:course:create
  transaction: read-write
  input_dto: CreateCourseManagementDto
  output_vo: Void
  touched_entities: *id001
- capability_id: update-course_management
  semantic_intent: update-record
  deterministic_pattern: update
  stability_class: stable
  api_group: course_management
  http_method: PUT
  route: /
  authority: business:course:update
  transaction: read-write
  input_dto: UpdateCourseManagementDto
  output_vo: Void
  touched_entities: *id001
- capability_id: batch-delete-course_management
  semantic_intent: delete-record
  deterministic_pattern: batch-delete
  stability_class: stable
  api_group: course_management
  http_method: DELETE
  route: /
  authority: business:course:delete
  transaction: read-write
  input_dto: CourseManagementIdSet
  output_vo: Void
  touched_entities: *id001
- capability_id: enquiry-course_management-page
  semantic_intent: query-page
  deterministic_pattern: page
  stability_class: stable
  api_group: course_management
  http_method: GET
  route: /page
  authority: business:course:page
  transaction: read-only
  input_dto: EnquiryCourseManagementPageDto
  output_vo: PageVo<CourseManagementPageVo>
  touched_entities: *id001
- capability_id: enquiry-course_management-details
  semantic_intent: query-details
  deterministic_pattern: details
  stability_class: stable
  api_group: course_management
  http_method: GET
  route: /{id}
  authority: business:course:details
  transaction: read-only
  input_dto: CourseManagementIdPath
  output_vo: CourseManagementDetailsVo
  touched_entities: *id001
- capability_id: enquiry-course_management-list
  semantic_intent: query-list
  deterministic_pattern: list
  stability_class: stable
  api_group: course_management
  http_method: GET
  route: /list
  authority: business:course:list
  transaction: read-only
  input_dto: None
  output_vo: List<CourseManagementListVo>
  touched_entities: *id001
entity_graph:
  entities:
