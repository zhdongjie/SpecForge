compiler_context:
  source_spec_id: course_management-project-v1
  target_module_id: course-management
  regeneration_mode: create
  stability_goal: deterministic
  planner_tags:
  - bounded-module
  - course-center
  - default-enabled-blueprint
module_identity:
  module_name: course-management
  bounded_context: course-center
  semantic_role: business-domain
  responsibility_code: course_management
  package_root: org.eu.originalkeen.business.course
  route_namespace:
    course-management: /v1/business/course
generation_boundaries:
  single_module_only: true
  owns_aggregates: &id001
  - Course
  - CourseCatalog
  may_reference:
  - ResponseVo
  - PageVo
  - OperateLog
  - PreAuthorize
  must_not_generate:
