compiler_context:
  source_spec_id: notification_management-project-v1
  target_module_id: notification-management
  regeneration_mode: create
  stability_goal: deterministic
  planner_tags: [bounded-module, notification-center, validated-blueprint]
module_identity:
  module_name: notification-management
  bounded_context: notification-center
  semantic_role: business-domain
  responsibility_code: notification_management
  package_root: org.eu.originalkeen.business.notification
  route_namespace:
    notification-management: /v1/business/notification
generation_boundaries:
  single_module_only: true
  owns_aggregates: &entities
    - NotificationTemplate
    - NotificationDispatchTask
  may_reference: [ResponseVo, PageVo, OperateLog, PreAuthorize]
  must_not_generate: [authentication flows, user management, role management]
api_groups:
  - group_id: notification_management
    route_prefix: /v1/business/notification
    aggregate: NotificationTemplate
    capability_ids:
      - create-notification_management
      - update-notification_management
      - batch-delete-notification_management
      - enquiry-notification_management-page
      - enquiry-notification_management-details
      - enquiry-notification_management-list
capabilities:
  - capability_id: create-notification_management
    semantic_intent: create-record
    deterministic_pattern: create
    stability_class: stable
    api_group: notification_management
    http_method: POST
    route: /
    authority: business:notification:create
    transaction: read-write
    input_dto: CreateNotificationManagementDto
    output_vo: Void
    touched_entities: *entities
  - capability_id: update-notification_management
    semantic_intent: update-record
    deterministic_pattern: update
    stability_class: stable
    api_group: notification_management
    http_method: PUT
    route: /
    authority: business:notification:update
    transaction: read-write
    input_dto: UpdateNotificationManagementDto
    output_vo: Void
    touched_entities: *entities
  - capability_id: batch-delete-notification_management
    semantic_intent: delete-record
    deterministic_pattern: batch-delete
    stability_class: stable
    api_group: notification_management
    http_method: DELETE
    route: /
    authority: business:notification:delete
    transaction: read-write
    input_dto: NotificationManagementIdSet
    output_vo: Void
    touched_entities: *entities
  - capability_id: enquiry-notification_management-page
    semantic_intent: query-page
    deterministic_pattern: page
    stability_class: stable
    api_group: notification_management
    http_method: GET
    route: /page
    authority: business:notification:page
    transaction: read-only
    input_dto: EnquiryNotificationManagementPageDto
    output_vo: PageVo<NotificationManagementPageVo>
    touched_entities: *entities
  - capability_id: enquiry-notification_management-details
    semantic_intent: query-details
    deterministic_pattern: details
    stability_class: stable
    api_group: notification_management
    http_method: GET
    route: /{id}
    authority: business:notification:details
    transaction: read-only
    input_dto: NotificationManagementIdPath
    output_vo: NotificationManagementDetailsVo
    touched_entities: *entities
  - capability_id: enquiry-notification_management-list
    semantic_intent: query-list
    deterministic_pattern: list
    stability_class: stable
    api_group: notification_management
    http_method: GET
    route: /list
    authority: business:notification:list
    transaction: read-only
    input_dto: None
    output_vo: List<NotificationManagementListVo>
    touched_entities: *entities
entity_graph:
  entities:
    - entity_id: NotificationTemplate
      table: notification_template
      ownership: owned
      base_type: PrimaryKeyEntity
      aggregate_role: root
      relations: []
    - entity_id: NotificationDispatchTask
      table: notification_dispatch_task
      ownership: owned
      base_type: PrimaryKeyEntity
      aggregate_role: root
      relations: []
validation_rules: {uniqueness: [], referential: [], shape: []}
architecture_constraints: {modular_monolith_mode: true, response_wrapper_must_be: ResponseVo, page_wrapper_must_be: PageVo, security_annotation_required: true}
persistence_conventions: {framework: mybatis-flex, database: mysql}
localization_requirements: {mandatory: false, languages: [], localized_aggregates: [], localized_fields: {}, fallback_policy: none}
audit_behavior: {access_log: none, operate_log: {enabled: true, target_capabilities: [create-notification_management, update-notification_management, batch-delete-notification_management]}}
generation_contract: {deterministic_output_required: true, preserve_project_contracts: [modular-monolith-boundaries, centralized-authority-based-security], blueprint_status: default-enabled-validated-blueprint}
