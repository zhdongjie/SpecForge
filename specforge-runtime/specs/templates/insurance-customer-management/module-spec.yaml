compiler_context:
  source_spec_id: insurance_customer_management-project-v1
  target_module_id: insurance-customer-management
  regeneration_mode: create
  stability_goal: deterministic
  planner_tags:
    - bounded-module
    - insurance-customer-center
    - default-enabled-blueprint
module_identity:
  module_name: insurance-customer-management
  bounded_context: insurance-customer-center
  semantic_role: business-domain
  responsibility_code: insurance_customer_management
  package_root: org.eu.originalkeen.business.insurancecustomer
  route_namespace:
    insurance-customer-management: /v1/business/insurance-customer
generation_boundaries:
  single_module_only: true
  owns_aggregates: &customer_entities
    - InsuranceCustomer
    - CustomerBeneficiary
  may_reference:
    - ResponseVo
    - PageVo
    - OperateLog
    - PreAuthorize
  must_not_generate:
    - authentication flows
    - user management
    - role management
api_groups:
  - group_id: insurance_customer_management
    route_prefix: /v1/business/insurance-customer
    aggregate: InsuranceCustomer
    capability_ids:
      - create-insurance_customer_management
      - update-insurance_customer_management
      - batch-delete-insurance_customer_management
      - enquiry-insurance_customer_management-page
      - enquiry-insurance_customer_management-details
      - enquiry-insurance_customer_management-list
capabilities:
  - capability_id: create-insurance_customer_management
    semantic_intent: create-record
    deterministic_pattern: create
    stability_class: stable
    api_group: insurance_customer_management
    http_method: POST
    route: /
    authority: business:insurance-customer:create
    transaction: read-write
    input_dto: CreateInsuranceCustomerManagementDto
    output_vo: Void
    touched_entities: *customer_entities
  - capability_id: update-insurance_customer_management
    semantic_intent: update-record
    deterministic_pattern: update
    stability_class: stable
    api_group: insurance_customer_management
    http_method: PUT
    route: /
    authority: business:insurance-customer:update
    transaction: read-write
    input_dto: UpdateInsuranceCustomerManagementDto
    output_vo: Void
    touched_entities: *customer_entities
  - capability_id: batch-delete-insurance_customer_management
    semantic_intent: delete-record
    deterministic_pattern: batch-delete
    stability_class: stable
    api_group: insurance_customer_management
    http_method: DELETE
    route: /
    authority: business:insurance-customer:delete
    transaction: read-write
    input_dto: InsuranceCustomerManagementIdSet
    output_vo: Void
    touched_entities: *customer_entities
  - capability_id: enquiry-insurance_customer_management-page
    semantic_intent: query-page
    deterministic_pattern: page
    stability_class: stable
    api_group: insurance_customer_management
    http_method: GET
    route: /page
    authority: business:insurance-customer:page
    transaction: read-only
    input_dto: EnquiryInsuranceCustomerManagementPageDto
    output_vo: PageVo<InsuranceCustomerManagementPageVo>
    touched_entities: *customer_entities
  - capability_id: enquiry-insurance_customer_management-details
    semantic_intent: query-details
    deterministic_pattern: details
    stability_class: stable
    api_group: insurance_customer_management
    http_method: GET
    route: /{id}
    authority: business:insurance-customer:details
    transaction: read-only
    input_dto: InsuranceCustomerManagementIdPath
    output_vo: InsuranceCustomerManagementDetailsVo
    touched_entities: *customer_entities
  - capability_id: enquiry-insurance_customer_management-list
    semantic_intent: query-list
    deterministic_pattern: list
    stability_class: stable
    api_group: insurance_customer_management
    http_method: GET
    route: /list
    authority: business:insurance-customer:list
    transaction: read-only
    input_dto: None
    output_vo: List<InsuranceCustomerManagementListVo>
    touched_entities: *customer_entities
entity_graph:
  entities:
    - entity_id: InsuranceCustomer
      table: insurance_customer
      ownership: owned
      base_type: PrimaryKeyEntity
      aggregate_role: root
      relations: []
    - entity_id: CustomerBeneficiary
      table: customer_beneficiary
      ownership: owned
      base_type: PrimaryKeyEntity
      aggregate_role: root
      relations: []
artifact_contract:
  resource:
    - InsuranceCustomerManagementResource
  manager:
    - InsuranceCustomerManagementManager
  service:
    - InsuranceCustomerManagementService
  service_impl:
    - InsuranceCustomerManagementServiceImpl
  mapper:
    - InsuranceCustomerManagementMapper
  entity: *customer_entities
  dto:
    - CreateInsuranceCustomerManagementDto
    - UpdateInsuranceCustomerManagementDto
    - EnquiryInsuranceCustomerManagementPageDto
  vo:
    - InsuranceCustomerManagementDetailsVo
    - InsuranceCustomerManagementPageVo
    - InsuranceCustomerManagementListVo
  bo: []
validation_rules:
  uniqueness: []
  referential: []
  shape: []
architecture_constraints:
  modular_monolith_mode: true
  response_wrapper_must_be: ResponseVo
  page_wrapper_must_be: PageVo
  security_annotation_required: true
persistence_conventions:
  framework: mybatis-flex
  database: mysql
localization_requirements:
  mandatory: false
  languages: []
  localized_aggregates: []
  localized_fields: {}
  fallback_policy: none
audit_behavior:
  access_log: none
  operate_log:
    enabled: true
    target_capabilities:
      - create-insurance_customer_management
      - update-insurance_customer_management
      - batch-delete-insurance_customer_management
generation_contract:
  deterministic_output_required: true
  preserve_project_contracts:
    - modular-monolith-boundaries
    - centralized-authority-based-security
  blueprint_status: default-enabled-validated-blueprint
