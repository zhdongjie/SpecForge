architectural_bindings:
  code_conventions:
    resource_suffix: Resource
    manager_suffix: Manager
    service_suffix: Service
    service_impl_suffix: ServiceImpl
    mapper_suffix: Mapper
    entity_suffix: Entity
    dto_prefixes:
      create: Create
      update: Update
      enquiry_page: Enquiry
      validate_unique: Validate
    vo_suffixes:
      details: DetailsVo
      page: PageVo
      list: ListVo
  annotation_bindings:
    resource_annotations:
    - '@CrossOrigin'
    - '@Validated when parameter validation exists'
    - '@RestController'
    - '@RequestMapping'
    mutation_annotations:
    - '@PreAuthorize'
    - '@OperateLog'
    query_annotations:
    - '@PreAuthorize'
    dependency_injection: '@Resource'
  response_bindings:
    wrapper_type: ResponseVo
    page_type: PageVo
    mutation_payload: Void
    unique_check_payload: Boolean
