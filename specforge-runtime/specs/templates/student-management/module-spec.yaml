compiler_context:
  source_spec_id: student_management-project-v1
  target_module_id: student-management
  regeneration_mode: create
  stability_goal: deterministic
  planner_tags:
  - bounded-module
  - student-center
  - default-enabled-blueprint
module_identity:
  module_name: student-management
  bounded_context: student-center
  semantic_role: business-domain
  responsibility_code: student_management
  package_root: org.eu.originalkeen.business.student
  route_namespace:
    student-management: /v1/business/student
generation_boundaries:
  single_module_only: true
  owns_aggregates: &id001
  - Student
  - StudentProfile
  may_reference:
  - ResponseVo
  - PageVo
  - OperateLog
  - PreAuthorize
  must_not_generate:
  - authentication flows
  - user management
  - role management
api_groups:
- group_id: student_management
  route_prefix: /v1/business/student
  aggregate: Student
  capability_ids:
  - create-student_management
  - update-student_management
  - batch-delete-student_management
  - enquiry-student_management-page
  - enquiry-student_management-details
  - enquiry-student_management-list
capabilities:
- capability_id: create-student_management
  semantic_intent: create-record
  deterministic_pattern: create
  stability_class: stable
  api_group: student_management
  http_method: POST
  route: /
  authority: business:student:create
  transaction: read-write
  input_dto: CreateStudentManagementDto
  output_vo: Void
  touched_entities: *id001
- capability_id: update-student_management
  semantic_intent: update-record
  deterministic_pattern: update
  stability_class: stable
  api_group: student_management
  http_method: PUT
  route: /
  authority: business:student:update
  transaction: read-write
  input_dto: UpdateStudentManagementDto
  output_vo: Void
  touched_entities: *id001
- capability_id: batch-delete-student_management
  semantic_intent: delete-record
  deterministic_pattern: batch-delete
  stability_class: stable
  api_group: student_management
  http_method: DELETE
  route: /
  authority: business:student:delete
  transaction: read-write
  input_dto: StudentManagementIdSet
  output_vo: Void
  touched_entities: *id001
- capability_id: enquiry-student_management-page
  semantic_intent: query-page
  deterministic_pattern: page
  stability_class: stable
  api_group: student_management
  http_method: GET
  route: /page
  authority: business:student:page
  transaction: read-only
  input_dto: EnquiryStudentManagementPageDto
  output_vo: PageVo<StudentManagementPageVo>
  touched_entities: *id001
- capability_id: enquiry-student_management-details
  semantic_intent: query-details
  deterministic_pattern: details
  stability_class: stable
  api_group: student_management
  http_method: GET
  route: /{id}
  authority: business:student:details
  transaction: read-only
  input_dto: StudentManagementIdPath
  output_vo: StudentManagementDetailsVo
  touched_entities: *id001
- capability_id: enquiry-student_management-list
  semantic_intent: query-list
  deterministic_pattern: list
  stability_class: stable
  api_group: student_management
  http_method: GET
  route: /list
  authority: business:student:list
  transaction: read-only
  input_dto: None
  output_vo: List<StudentManagementListVo>
  touched_entities: *id001
entity_graph:
  entities:
  - entity_id: Student
    table: student
    ownership: owned
    base_type: PrimaryKeyEntity
    aggregate_role: root
    relations: []
  - entity_id: StudentProfile
    table: student_profile
    ownership: owned
    base_type: PrimaryKeyEntity
    aggregate_role: root
    relations: []
artifact_contract:
  resource:
  - StudentManagementResource
  manager:
  - StudentManagementManager
  service:
  - StudentManagementService
  service_impl:
  - StudentManagementServiceImpl
  mapper:
  - StudentManagementMapper
  entity: *id001
  dto:
  - CreateStudentManagementDto
  - UpdateStudentManagementDto
  - EnquiryStudentManagementPageDto
  vo:
  - StudentManagementDetailsVo
  - StudentManagementPageVo
  - StudentManagementListVo
  bo: []
validation_rules:
  uniqueness: []
  referential: []
  shape: []
architecture_constraints:
  modular_monolith_mode: true
  response_wrapper_must_be: ResponseVo
  page_wrapper_must_be: PageVo
  security_annotation_required: true
persistence_conventions:
  framework: mybatis-flex
  database: mysql
localization_requirements:
  mandatory: false
  languages: []
  localized_aggregates: []
  localized_fields: {}
  fallback_policy: none
audit_behavior:
  access_log: none
  operate_log:
    enabled: true
    target_capabilities:
    - create-student_management
    - update-student_management
    - batch-delete-student_management
generation_contract:
  deterministic_output_required: true
  preserve_project_contracts:
  - modular-monolith-boundaries
  - centralized-authority-based-security
  blueprint_status: default-enabled-validated-blueprint
